      required: [['title', 'العنوان'], ['body', 'النص'], ['source', 'المصدر'], ['published_at', 'تاريخ النشر']],
      check(r) { const bad = []; if (!/^\d{4}-\d{2}-\d{2}/.test(r.published_at || '')) bad.push('تاريخ النشر غير صالح');
        if (r.url && !/^https?:\/\/\S+\.\S+/.test(r.url)) bad.push('رابط الخبر غير صالح'); return bad; } }
  };
  const blank = () => ({ schema: 1, kind: 'catalog', version: 1, books: [], videos: [], news: [] });
  async function init(seed) { cat = (await KV.get('catalog:current')) || seed || blank(); for (const k of Object.keys(SPEC)) cat[k] = cat[k] || []; return cat; }
  function load(obj) { cat = Object.assign(blank(), obj || {}); for (const k of Object.keys(SPEC)) cat[k] = cat[k] || []; return cat; }
  const save = () => KV.set('catalog:current', cat);
  function validate(coll, r, pack) {
    const sp = SPEC[coll]; if (!sp) return ['مجموعة غير معروفة: ' + coll];
    const bad = []; if (!r.id) bad.push('لا يوجد معرف');
    for (const [f, l] of sp.required) if (!r[f]) bad.push('ينقصه ' + l);
    return bad.concat(sp.check(r, pack));
  }
  async function commit(coll, rec) {
    if (remote) rec = await remote(coll, rec);         // the server's copy, after its own rules
    const i = cat[coll].findIndex(x => x.id === rec.id);
    if (i >= 0) cat[coll][i] = rec; else cat[coll].push(rec);
    await save(); return rec;
  }
  async function upsert(coll, r, pack) {
    const sp = SPEC[coll]; if (!sp) throw err('مجموعة غير معروفة: ' + coll, 'ValidationError');
    Perm.assert(sp.write);
    const i = cat[coll].findIndex(x => x.id === r.id), prev = i >= 0 ? cat[coll][i] : null;
    let status = r.status || (prev && prev.status) || 'draft';
    if (status === 'published' && !Perm.can(sp.publish)) status = 'draft';
    const rec = Object.assign({}, prev || {}, r, { status, rev: ((prev && prev.rev) || 0) + 1, updated: Date.now(), by: Perm.user.id });
    const bad = validate(coll, rec, pack); if (bad.length) throw err('مرفوض: ' + bad.join(' ، '), 'ValidationError');
    return commit(coll, rec);
  }
  async function setStatus(coll, id, status, pack) {
    const sp = SPEC[coll]; Perm.assert(status === 'published' ? sp.publish : sp.write);
    if (!['draft', 'published', 'hidden'].includes(status)) throw err('حالة غير معروفة', 'ValidationError');
    const r = cat[coll].find(x => x.id === id); if (!r) throw err('غير موجود: ' + id);
    const rec = Object.assign({}, r, { status, updated: Date.now() });
    const bad = validate(coll, rec, pack); if (bad.length) throw err('مرفوض: ' + bad.join(' ، '), 'ValidationError');
    return commit(coll, rec);
  }
  async function remove(coll, id) {                   // logical delete: kept for history, gone for students
    Perm.assert(SPEC[coll].write);
    const r = cat[coll].find(x => x.id === id); if (!r) return false;
    await commit(coll, Object.assign({}, r, { deleted: true, status: 'hidden', updated: Date.now() })); return true;
  }
  function list(coll, f) {
    f = f || {};
    return (cat[coll] || []).filter(r => !r.deleted && (!f.published || r.status === 'published')
      && (!f.chapter || r.chapter === f.chapter) && (!f.topic || r.topic === f.topic) && (!f.book || !r.book || r.book === f.book));
  }
  function get(coll, id) { return (cat[coll] || []).find(r => r.id === id) || null; }
  const strip = r => { const o = Object.assign({}, r); for (const k of ['rev', 'updated', 'by', 'updated_by', 'updated_at']) delete o[k]; return o; };
  function publicCatalog() {                           // what students receive: published and not deleted, nothing else
    return { schema: 1, kind: 'catalog', version: 0,
      books: list('books', { published: true }).map(strip), videos: list('videos', { published: true }).map(strip), news: list('news', { published: true }).map(strip) };
  }
  function exportCatalog() { return JSON.parse(JSON.stringify(cat)); }
  async function applyCatalog(obj) { if (!obj || obj.kind !== 'catalog') throw err('ليس كتالوج محتوى', 'ValidationError'); cat = obj; await save(); return cat; }
  return { init, load, upsert, setStatus, remove, list, get, validate, checkStructure, exportCatalog, publicCatalog, applyCatalog, SPEC,
    setRemote(fn) { remote = fn; }, get version() { return cat ? cat.version : 0; }, bump() { cat.version = (cat.version || 1) + 1; return save(); } };
})();

async function sha256(text) {
  const buf = await crypto.subtle.digest('SHA-256', typeof text === 'string' ? new TextEncoder().encode(text) : text);
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
}

/* ECDSA P-256 over the exact manifest text. The private key stays with the founder; the app carries the
   public key. A stolen dashboard password alone cannot push content to students. */
const Sign = (() => {
  const ALG = { name: 'ECDSA', namedCurve: 'P-256' }, SIG = { name: 'ECDSA', hash: 'SHA-256' };
  const b64 = buf => { let s = ''; for (const b of new Uint8Array(buf)) s += String.fromCharCode(b); return btoa(s); };
  const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  async function generate() {
    const k = await crypto.subtle.generateKey(ALG, true, ['sign', 'verify']);
    const priv = await crypto.subtle.exportKey('jwk', k.privateKey), pub = await crypto.subtle.exportKey('jwk', k.publicKey);
    return { privateJwk: priv, publicJwk: { kty: pub.kty, crv: pub.crv, x: pub.x, y: pub.y } };
  }
  async function sign(privateJwk, text) {
    const key = await crypto.subtle.importKey('jwk', privateJwk, ALG, false, ['sign']);
    return b64(await crypto.subtle.sign(SIG, key, new TextEncoder().encode(text)));
  }
  async function verify(publicJwk, text, sig) {
    try { const key = await crypto.subtle.importKey('jwk', publicJwk, ALG, false, ['verify']);
      return await crypto.subtle.verify(SIG, key, unb64(String(sig).trim()), new TextEncoder().encode(text)); }
    catch (e) { return false; }
  }
  async function fingerprint(pub) { return (await sha256(pub.x + '.' + pub.y)).slice(0, 16); }
  function publicOf(privateJwk) { return { kty: privateJwk.kty, crv: privateJwk.crv, x: privateJwk.x, y: privateJwk.y }; }
  return { generate, sign, verify, fingerprint, publicOf };
})();

/* the founder turns what is live into a release */
const Release = (() => {
  async function build(opts) {
    opts = opts || {};
    Perm.assert('content:release');
    const prev = opts.prev || null, prevV = (prev && prev.versions) || {}, prevH = (prev && prev.hashes) || {};
    const stamp = Math.floor(Date.now() / 1000);
    // unchanged content keeps its version; changed content gets a version no installed copy can have
    const ver = (key, h, old) => (prevH[key] === h && old ? old : Math.max((old || 0) + 1, stamp));
    const files = {}, versions = { banks: {}, catalog: 0, booklets: {} }, hashes = {};
    const hashOf = async (key, obj) => (hashes[key] = await sha256(JSON.stringify(Object.assign({}, obj, { version: 0 }))));
    const books = Catalog.list('books', { published: true }).map(b => b.id);
    const bookIds = books.length ? books : [Bank.meta && Bank.meta.book].filter(Boolean);
    for (const id of bookIds) {
      const bank = Bank.bankFor(id), key = 'bank-' + id;
      bank.version = ver(key, await hashOf(key, bank), (prevV.banks || {})[id]);
      versions.banks[id] = bank.version; files[key + '.json'] = JSON.stringify(bank);
    }
    const catalog = Catalog.publicCatalog();
    catalog.version = versions.catalog = ver('catalog', await hashOf('catalog', catalog), prevV.catalog);
    files['catalog.json'] = JSON.stringify(catalog);
    for (const b of Booklets.all().filter(b => b.status === 'published' && !b.deleted)) {
      const key = 'booklet-' + b.id, v = ver(key, await hashOf(key, b), ((prevV.booklets || {})[b.id] || {}).version);
      versions.booklets[b.id] = { version: v, book: b.book }; files[key + '.json'] = JSON.stringify(Object.assign({}, b, { version: v }));
    }
    const entries = {};
    for (const [name, text] of Object.entries(files)) { const s = await sha256(text); entries[name] = { sha256: s, bytes: text.length, path: 'files/' + s + '.json' }; }
    const manifest = { schema: 2, kind: 'content-release', id: 'rel-' + Date.now().toString(36), created: new Date().toISOString(),
      by: Perm.user.id, note: opts.note || '', versions, hashes, files: entries };
    if (opts.moved_to) manifest.moved_to = opts.moved_to;
    const manifestText = JSON.stringify(manifest), sig = opts.key ? await Sign.sign(opts.key, manifestText) : null;
    // one file, uploaded in one step: a device can never see a manifest with someone else's signature
    return { manifest, manifestText, sig, envelope: JSON.stringify({ manifest: manifestText, sig }), files };
  }
  return { build };
})();

/* the student app pulls releases: verify, validate, then apply everything or nothing */
const Sync = (() => {
  const err = (m) => { const e = new Error(m); e.name = 'SyncError'; return e; };
  async function getText(url) {
    const r = await fetch(url, { cache: 'no-store' });
    if (!r.ok) throw err('HTTP ' + r.status + ' ' + url);
    return r.text();
  }
  function checkBank(bank, s) {
    if (!bank || bank.kind !== 'question-bank') return ['ملف الأسئلة ليس بنك أسئلة'];
    const bad = [], topics = new Map((s.topics || []).map(t => [t.id, t])), ids = new Set();
    for (const it of bank.items) {
      if (it.deleted) continue;
      ids.add(it.id);
      if (!topics.has(it.topic)) bad.push(it.id + ': موضوع غير موجود ' + it.topic);
      else if (topics.get(it.topic).chapter !== it.chapter) bad.push(it.id + ': الموضوع لا يعود للفصل');
    }
    for (const x of bank.sets || []) for (const i of x.items) if (!ids.has(i)) bad.push('الاختبار ' + x.id + ' يشير إلى سؤال غير موجود ' + i);
    return bad;
  }
  function checkCatalog(cat, own, ownBook) {
    if (!cat || cat.kind !== 'catalog') return ['ملف الكتالوج غير صالح'];
    const bad = [], structureOf = id => (!id || id === ownBook) ? own : ((cat.books || []).find(b => b.id === id) || {}).structure;
    for (const coll of Object.keys(Catalog.SPEC)) for (const r of cat[coll] || []) {
      if (r.deleted) continue;
      const s = coll === 'videos' ? structureOf(r.book) : own;
      for (const b of Catalog.validate(coll, r, coll === 'books' ? null : s)) bad.push(coll + '/' + r.id + ': ' + b);
    }
    return bad;
  }
  async function run(base, opts) {
    opts = opts || {};
    const pubkey = opts.pubkey !== undefined ? opts.pubkey : (typeof RELEASE_PUBKEY !== 'undefined' ? RELEASE_PUBKEY : null);
    const book = opts.book || (Bank.meta && Bank.meta.book);
    base = String((!opts.depth && (await KV.get('sync:base'))) || base || '').replace(/\/?$/, '/');
    const own = Content.pack, result = { ok: false, applied: [], skipped: [], problems: [], at: Date.now(), base };
    try {
      if (!base || base === '/') throw err('لا يوجد عنوان لقناة المحتوى');
      let env = null;
      try { env = JSON.parse(await getText(base + 'latest/release.json')); } catch (e) { if (e.name === 'SyncError') throw e; env = null; }
      const text = env && typeof env.manifest === 'string' ? env.manifest : null;
      if (!text) throw err('ملف الإصدار غير صالح');
      if (pubkey) {
        if (!env.sig) throw err('الإصدار غير موقّع — رُفض كاملًا');
        if (!(await Sign.verify(pubkey, text, env.sig))) throw err('توقيع الإصدار غير صحيح — رُفض كاملًا');
      }
      const manifest = JSON.parse(text);
      if (manifest.kind !== 'content-release' || manifest.schema !== 2) throw err('ملف الإصدار غير صالح');
      if (manifest.moved_to && manifest.moved_to.replace(/\/?$/, '/') !== base) {
        if (!/^https:\/\/\S+$/.test(manifest.moved_to)) throw err('عنوان النقل غير آمن');
        if ((opts.depth || 0) >= 2) throw err('سلسلة نقل أطول من المسموح');
        await KV.set('sync:base', manifest.moved_to);
        const r2 = await run(manifest.moved_to, Object.assign({}, opts, { depth: (opts.depth || 0) + 1 }));
        r2.moved = manifest.moved_to; return r2;
      }
      const want = [], v = manifest.versions || {};
      if (((v.banks || {})[book] || 0) > ((Bank.meta || {}).version || 0)) want.push('bank-' + book + '.json'); else result.skipped.push('bank');
      if ((v.catalog || 0) > (Catalog.version || 0)) want.push('catalog.json'); else result.skipped.push('catalog');
      for (const [id, b] of Object.entries(v.booklets || {})) {
        if (b.book !== book) continue;                   // other books' booklets are not this app's business
        const cur = Booklets.get(id);
        if (!cur || (cur.version || 0) < b.version) want.push('booklet-' + id + '.json'); else result.skipped.push('booklet ' + id);
      }
      const got = {};                                     // 1. download and verify every file first
      for (const name of want) {
        const meta = manifest.files[name]; if (!meta) throw err('الملف ' + name + ' غير مذكور في الإصدار');
        const t = await getText(base + meta.path);
        if (await sha256(t) !== meta.sha256) throw err('بصمة الملف ' + name + ' لا تطابق — رُفض الإصدار كاملًا');
        got[name] = JSON.parse(t);
      }
      const bankFile = got['bank-' + book + '.json'];     // 2. validate every reference before touching anything
      if (bankFile) result.problems.push(...checkBank(bankFile, own));
      if (got['catalog.json']) result.problems.push(...checkCatalog(got['catalog.json'], own, book));
      if (result.problems.length) throw err('الإصدار يحتوي مراجع غير صالحة — لم يُطبَّق أي شيء');
      if (bankFile) { await Bank.applyBank(bankFile); result.applied.push('bank v' + bankFile.version); }      // 3. apply all of it
      if (got['catalog.json']) { await Catalog.applyCatalog(got['catalog.json']); result.applied.push('catalog v' + got['catalog.json'].version); }
      for (const [name, obj] of Object.entries(got)) if (name.startsWith('booklet-')) { await Booklets.applyRelease(obj); result.applied.push('booklet ' + obj.id + ' v' + obj.version); }
      result.ok = true; result.release = manifest.id;
    } catch (e) { result.error = e.message; }
    await KV.set('sync:last', result);
    return result;
  }
  return { run, checkBank, checkCatalog };
})();

'use strict';
/* cloud.js — the dashboard's link to Supabase, over its documented REST endpoints (no library to load).
   The project URL and public key are entered at runtime and stored locally, so moving to another
   project or a paid plan never needs a new build. Every write is checked by row-level security on
   the server; this file only reports what the server decided. */
const Cloud = (() => {
  let cfg = null, session = null, refreshing = null;
  const err = (m, code, status) => { const e = new Error(m); e.name = 'CloudError'; e.code = code; e.status = status || 0; return e; };
  // enforced columns per table; everything else of a record travels in `extra`
  const COLS = {
    books: ['id', 'title', 'subject', 'grade', 'edition', 'pages', 'file_url', 'file_path', 'sha256', 'bytes', 'structure', 'status', 'deleted'],
    exam_papers: ['id', 'book', 'year', 'session', 'subject', 'questions', 'status', 'deleted'],
    question_items: ['id', 'book', 'src_kind', 'exam', 'chapter', 'topic', 'status', 'prov', 'deleted'],
    question_sets: ['id', 'book', 'kind', 'chapter', 'title', 'items', 'prov', 'status', 'deleted'],
    booklets: ['id', 'book', 'title', 'author', 'origin', 'format', 'file_url', 'file_path', 'sha256', 'bytes', 'chapters', 'version', 'status', 'deleted'],
    videos: ['id', 'book', 'title', 'url', 'subject', 'chapter', 'topic', 'lesson', 'status', 'deleted'],
    news: ['id', 'title', 'body', 'source', 'url', 'published_at', 'status', 'deleted']
  };
  const LOCAL_ONLY = ['ready', 'rev', 'updated', 'by', 'updated_at', 'updated_by', 'dirty'];
  function toRow(table, rec) {
    const cols = COLS[table], row = { extra: {} };
    for (const [k, v] of Object.entries(rec)) {
      if (cols.includes(k)) row[k] = v === undefined ? null : v;
      else if (!LOCAL_ONLY.includes(k) && v !== undefined) row.extra[k] = v;
    }
    if (table === 'booklets') row.extra = JSON.parse(JSON.stringify(rec));     // the structured booklet travels whole
    return row;
  }
  function fromRow(table, row) {
    const rec = table === 'booklets' && row.extra && row.extra.kind === 'booklet' ? Object.assign({}, row.extra) : Object.assign({}, row.extra || {});
    for (const k of COLS[table]) if (row[k] !== undefined && row[k] !== null) rec[k] = row[k];
    if (row.updated_at) rec.updated_at = row.updated_at;
    if (table === 'question_items') { rec.ready = !!rec.answer; rec.rev = row.rev; }
    if (table === 'booklets') { rec.kind = 'booklet'; rec.items = rec.items || []; rec.schema = rec.schema || 1; }
    return rec;
  }

  /* ---------- config and session ---------- */
  async function load() { cfg = (await KV.get('cloud:config')) || null; session = (await KV.get('cloud:session')) || null; return cfg; }
  async function configure(url, anon) {
    url = String(url || '').trim().replace(/\/+$/, '');
    if (!/^https:\/\/[a-z0-9.-]+(:\d+)?$/i.test(url)) throw err('رابط المشروع يجب أن يبدأ بـ https:// مثل https://abcd.supabase.co', 'CONFIG');
    if (!/^[A-Za-z0-9._-]{20,}$/.test(String(anon || '').trim())) throw err('المفتاح العام غير صالح — انسخ Publishable key (يبدأ بـ sb_publishable_) أو anon key', 'CONFIG');
    cfg = { url, anon: String(anon).trim() }; await KV.set('cloud:config', cfg); return cfg;
  }
  async function forget() { cfg = null; session = null; await KV.set('cloud:config', null); await KV.set('cloud:session', null); }
  function need() { if (!cfg) throw err('لم يُضبط الاتصال بالخادم بعد', 'CONFIG'); }

  async function http(method, path, body, extra, auth) {
    need();
    const h = Object.assign({ apikey: cfg.anon, Authorization: 'Bearer ' + (auth === false || !session ? cfg.anon : session.access_token) }, extra || {});
    let payload = body;
    if (body !== undefined && !(body instanceof Blob) && !(body instanceof ArrayBuffer) && typeof body !== 'string') { payload = JSON.stringify(body); h['Content-Type'] = h['Content-Type'] || 'application/json'; }
    let r;
    try { r = await fetch(cfg.url + path, { method, headers: h, body: payload }); }
    catch (e) { throw err('تعذّر الوصول إلى الخادم. تحقق من الاتصال ومن رابط المشروع.', 'NETWORK'); }
    const text = await r.text(); let data = null;
    try { data = text ? JSON.parse(text) : null; } catch (e) { data = text; }
    if (!r.ok) throw classify(r.status, data);
    return { data, headers: r.headers };
  }
  function classify(status, d) {
    const msg = (d && (d.message || d.msg || d.error_description || d.error)) || ('HTTP ' + status), code = d && d.code;
    if (status === 401 || code === 'PGRST301') return err('الجلسة انتهت أو بيانات الدخول غير صحيحة', 'AUTH', status);
    if (status === 403 || code === '42501') return err('الخادم رفض العملية: لا تملك صلاحية ذلك', 'FORBIDDEN', status);
    if (status === 402) return err('تجاوز المشروع حدود الخطة المجانية مؤقتًا', 'QUOTA', status);
    if (status === 409 || code === '23505') return err('يوجد سجل بنفس المعرف', 'CONFLICT', status);
    if (status === 413) return err('الملف أكبر من الحد المسموح (50 MB في الخطة المجانية)', 'TOO_LARGE', status);
    if (code === '23514' || code === '23503' || code === '23502' || code === 'P0001' || code === '22P02') return err('الخادم رفض البيانات: ' + msg, 'INVALID', status);
    if (status >= 500) return err('خطأ في الخادم: ' + msg, 'SERVER', status);
    return err(msg, 'HTTP_' + status, status);
  }

  /* ---------- accounts ---------- */
  async function authCall(grant, body) {
    need();
    let r;
    try { r = await fetch(cfg.url + '/auth/v1/token?grant_type=' + grant, { method: 'POST', headers: { apikey: cfg.anon, 'Content-Type': 'application/json' }, body: JSON.stringify(body) }); }
    catch (e) { throw err('تعذّر الوصول إلى الخادم', 'NETWORK'); }
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw err(grant === 'password' ? 'البريد أو كلمة المرور غير صحيحة' : 'انتهت الجلسة، سجّل الدخول من جديد', 'AUTH', r.status);
    session = { access_token: d.access_token, refresh_token: d.refresh_token, expires_at: Math.floor(Date.now() / 1000) + (d.expires_in || 3600), user: { id: d.user && d.user.id, email: d.user && d.user.email } };
    await KV.set('cloud:session', session);
    return session;
  }
  const signIn = (email, password) => authCall('password', { email: String(email).trim(), password });
  async function fresh() {
    if (!session) return;
    if (session.expires_at - 60 > Date.now() / 1000) return;
    if (!refreshing) refreshing = authCall('refresh_token', { refresh_token: session.refresh_token }).finally(() => { refreshing = null; });
    await refreshing;
  }
  async function signOut() {
    try { if (session) await http('POST', '/auth/v1/logout', {}); } catch (e) { /* the local session goes either way */ }
    session = null; await KV.set('cloud:session', null);
  }
  async function me() {
    await fresh(); if (!session) return null;
    const { data } = await http('GET', '/rest/v1/profiles?select=*&user_id=eq.' + session.user.id);
    return data && data[0] ? Object.assign({}, data[0], { email: data[0].email || session.user.email }) : null;
  }

  /* ---------- tables ---------- */
  async function selectAll(table, filter) {
    await fresh();
    const out = [], page = 1000;                      // the API returns at most 1000 rows per request
    for (let from = 0; ; from += page) {
      const { data } = await http('GET', '/rest/v1/' + table + '?select=*' + (filter ? '&' + filter : '') + '&order=' + (table === 'profiles' ? 'user_id' : 'id') + '.asc', undefined,
        { 'Range-Unit': 'items', Range: from + '-' + (from + page - 1) });
      out.push(...(data || []));
      if (!data || data.length < page) return out;
    }
  }
  async function pull(table) { return (await selectAll(table)).map(r => fromRow(table, r)); }
  // one row in, the row the server actually stored out — after its triggers (e.g. status forced to review)
  async function put(table, rec) {
    await fresh();
    const { data } = await http('POST', '/rest/v1/' + table + '?on_conflict=id', [toRow(table, rec)],
      { Prefer: 'resolution=merge-duplicates,return=representation' });
    if (!Array.isArray(data) || data.length !== 1) throw err('الخادم لم يحفظ السجل: لا تملك صلاحية ذلك', 'FORBIDDEN', 403);
    return fromRow(table, data[0]);
  }
  // an update the rules forbid does not fail in Postgres — it changes zero rows; that is a refusal
  async function patch(table, key, value, fields) {
    await fresh();

  async function coverData(file) {                          // a small cover travels inside the record: no extra download
    if (!/^image\//.test(file.type)) throw new Error('الغلاف يجب أن يكون صورة');
    const url = URL.createObjectURL(file);
    try {
      const img = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => no(new Error('تعذّرت قراءة صورة الغلاف')); i.src = url; });
      const w = Math.min(300, img.naturalWidth), h = Math.round(w * img.naturalHeight / img.naturalWidth);
      const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(img, 0, 0, w, h);
      const out = c.toDataURL('image/webp', 0.72);
      return out.startsWith('data:image/webp') ? out : c.toDataURL('image/jpeg', 0.75);
    } finally { URL.revokeObjectURL(url); }
  }

  function readQuestion() {

    if (k === 'choice') { a.options = lines(d.options); a.correct = (+d.correct || 0) - 1; }
    if (k === 'multi') { a.options = lines(d.options); a.correct = String(d.correct || '').split(/[,،\s]+/).filter(Boolean).map(x => +x - 1); }
    if (k === 'bool') a.correct = d.bool === 'true';
    if (k === 'numeric') Object.assign(a, { value: +d.value, unit: d.unit, tol: +d.tol || 0.02, expr: d.expr, solution: d.solution });
    if (k === 'exact') a.accept = lines(d.accept);
    if (k === 'essay') a.keys = lines(d.keys);
    if (k !== 'numeric') a.model = d.model;
    it.answer = a;
    if (d.src_kind === 'ministry') { it.exam = d.exam || null; it.number = d.number; it.ministry = d.exam ? undefined : { year: d.m_year, session: d.m_session }; delete it.prov; }

    return it;
  }

      <p class="note wide">أعمدة CSV: id, chapter, topic, kind (choice / multi / bool / numeric / exact / essay), text, options (مفصولة بـ |), correct (رقم الخيار من 1، أو 1|3، أو صح/خطأ), value, unit, tol, expr, solution, accept, keys, model, marks. أعمدة المصدر اختيارية لكل صف: source_name, source_url, retrieved_at, from_internet. كل سؤال مستورد يدخل «بانتظار المراجعة» ولا يصل للطلاب قبل اعتماده.</p>
      <div class="wide acts"><button class="solid" data-do="import-run">تحقق واستيراد</button></div></form>
      ${report ? `<div class="report"><b>استُورد ${report.ok} سؤالًا — بانتظار المراجعة. رُفض ${report.bad.length}.</b>
        ${report.bad.length ? table(['الصف', 'المعرف', 'السبب'], report.bad.map(r => `<tr><td>${r.row}</td><td dir="ltr">${esc(r.id || '—')}</td><td>${esc(r.reason)}</td></tr>`)) : ''}</div>` : ''}`;
  }
  function parseCSV(text) {
    const rows = []; let row = [], cell = '', q = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) { if (c === '"' && text[i + 1] === '"') { cell += '"'; i++; } else if (c === '"') q = false; else cell += c; }
      else if (c === '"') q = true;
      else if (c === ',') { row.push(cell); cell = ''; }
      else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
      else cell += c;
    }
    if (cell || row.length) { row.push(cell); rows.push(row); }
    const clean = rows.filter(r => r.some(x => x.trim()));
    if (!clean.length) return [];
    const h = clean[0].map(x => x.trim().replace(/^\uFEFF/, ''));
    return clean.slice(1).map(r => Object.fromEntries(h.map((k, i) => [k, (r[i] || '').trim()])));
  }
  function rowToItem(r, dflt) {
    const k = (r.kind || '').trim(), split = s => String(s || '').split('|').map(x => x.trim()).filter(Boolean);
    const a = { kind: k };
    if (k === 'choice') { a.options = split(r.options); a.correct = (+r.correct || 0) - 1; a.model = r.model || undefined; }
    else if (k === 'multi') { a.options = split(r.options); a.correct = split(r.correct).map(x => +x - 1); a.model = r.model || undefined; }
    else if (k === 'bool') { const v = Bank.normText(r.correct); a.correct = ['صح', 'true', '1', 'نعم'].includes(v) ? true : ['خطا', 'false', '0', 'لا'].includes(v) ? false : null; a.model = r.model || undefined; }
    else if (k === 'numeric') Object.assign(a, { value: parseFloat(r.value), unit: r.unit || undefined, tol: parseFloat(r.tol) || 0.02, expr: r.expr, solution: r.solution || undefined });
    else if (k === 'exact') { a.accept = split(r.accept); a.model = r.model || undefined; }
    else if (k === 'essay') { a.keys = split(r.keys); a.model = r.model || undefined; }
    const fi = r.from_internet !== undefined && r.from_internet !== '' ? /^(1|true|نعم)$/i.test(r.from_internet) : dflt.from_internet;
    return { id: r.id, book: dflt.book, src_kind: dflt.src_kind, chapter: r.chapter, topic: r.topic, type: k, text: r.text, marks: r.marks ? +r.marks : undefined,
      answer: k ? a : undefined, status: 'review',
      prov: { source_name: r.source_name || dflt.source_name, subject: dflt.subject, grade: dflt.grade, from_internet: !!fi,
        source_url: r.source_url || dflt.source_url || undefined, retrieved_at: r.retrieved_at || dflt.retrieved_at || undefined } };
  }
  async function runImport() {
    const d = formData('#f'), file = d.__form.file.files[0];
    const text = file ? await file.text() : d.text;
    if (!String(text || '').trim()) throw new Error('اختر ملفًا أو الصق المحتوى');
    const dflt = { book: d.book, src_kind: d.src_kind, source_name: d.source_name, subject: d.subject, grade: d.grade,
      from_internet: !!d.from_internet, source_url: d.source_url, retrieved_at: d.retrieved_at };
    let raw;
    if (/^\s*[\[{]/.test(text)) { const j = JSON.parse(text); raw = (Array.isArray(j) ? j : j.items || []).map(x => Object.assign({ status: 'review' }, x, { book: dflt.book, src_kind: x.src_kind || dflt.src_kind,
      prov: Object.assign({ source_name: dflt.source_name, subject: dflt.subject, grade: dflt.grade, from_internet: dflt.from_internet, source_url: dflt.source_url || undefined, retrieved_at: dflt.retrieved_at || undefined }, x.prov || {}) })); }
    else raw = parseCSV(text).map(r => rowToItem(r, dflt));
    report = { ok: 0, bad: [] };
    for (let n = 0; n < raw.length; n++) {
      const it = raw[n];
      if (!it.id) it.id = 'imp-' + Date.now().toString(36) + '-' + n;
      if (Bank.item(it.id)) { report.bad.push({ row: n + 1, id: it.id, reason: 'يوجد سؤال بنفس المعرف — لا يُستبدل سؤال موجود عبر الاستيراد' }); continue; }
      it.status = 'review';
      try { await Bank.upsertItem(it, structureOf(it.book)); report.ok++; }
      catch (e) { report.bad.push({ row: n + 1, id: it.id, reason: e.message.replace(/^السؤال مرفوض: /, '') }); }
    }
    return report;
  }

  function verOf(m, name) {
    const v = m.versions || {};

    const b = name.match(/^bank-(.+)\.json$/); if (b) return (v.banks || {})[b[1]];

  async function publishRelease() {
    const d = formData('#f');
    if (d.moved_to && !/^https:\/\/\S+$/.test(d.moved_to)) throw new Error('عنوان النقل يجب أن يبدأ بـ https://');
    if (!signKey && mode === 'cloud' && !confirm('لا يوجد مفتاح توقيع. التطبيق الذي يحمل مفتاحًا عامًا سيرفض إصدارًا غير موقّع. متابعة؟')) return null;
    const prev = releases[0] && releases[0].manifest;
    const rel = await Release.build({ prev, key: signKey && signKey.privateJwk, note: d.note, moved_to: d.moved_to || undefined });
    if (mode === 'cloud') {
      // files first, the release pointer last: a device never sees a release whose files are not there yet
      for (const [name, meta] of Object.entries(rel.manifest.files)) {
        msg('جارٍ رفع ' + name + '…');
        await Cloud.upload('releases', meta.path, new Blob([rel.files[name]], { type: 'application/json' }), 'application/json');
      }
      await Cloud.upload('releases', 'archive/' + rel.manifest.id + '.json', new Blob([rel.envelope], { type: 'application/json' }), 'application/json');
      await Cloud.upload('releases', 'latest/release.json', new Blob([rel.envelope], { type: 'application/json' }), 'application/json', 60);
      releases.unshift(await Cloud.insert('releases', { id: rel.manifest.id, manifest: rel.manifest, note: d.note || null }));
    } else {
      releases.unshift({ id: rel.manifest.id, manifest: rel.manifest, note: d.note, created_at: rel.manifest.created });
      download('release.json', rel.envelope);
    }
    lastRelease = rel; return rel;
  }
  async function keyAction(what) {
    if (what === 'key-new') {
      const k = await Sign.generate();
      signKey = { privateJwk: k.privateJwk, publicJwk: k.publicJwk, fingerprint: await Sign.fingerprint(k.publicJwk), created: new Date().toISOString() };
      await KV.set('sign:key', signKey);
      download('sadiqak-signing-key-PRIVATE.json', JSON.stringify(signKey));
      return 'أُنشئ المفتاح ونُزّلت نسخته الاحتياطية — احفظها في مكان آمن ولا تشاركها مع أحد';
    }
    if (what === 'key-backup') { download('sadiqak-signing-key-PRIVATE.json', JSON.stringify(signKey)); return 'نُزّلت النسخة الاحتياطية'; }
    if (what === 'key-public') { download('sadiqak-release-public-key.json', JSON.stringify(signKey.publicJwk)); return 'نُزّل المفتاح العام'; }
    if (what === 'key-import') { $('#keyFile').click(); return null; }
  }
  async function importKey(file) {
    const j = JSON.parse(await file.text()), priv = j.privateJwk || j;
    if (!priv || priv.kty !== 'EC' || priv.crv !== 'P-256' || !priv.d) throw new Error('هذا ليس ملف مفتاح توقيع خاص');
    const pub = Sign.publicOf(priv), probe = await Sign.sign(priv, 'probe');
    if (!(await Sign.verify(pub, 'probe', probe))) throw new Error('المفتاح تالف');
    signKey = { privateJwk: priv, publicJwk: pub, fingerprint: await Sign.fingerprint(pub), created: j.created || new Date().toISOString() };
    await KV.set('sign:key', signKey);
  }

      case 'paper-save': { const f = formData('#f'); delete f.__form; const r = await act(() => Bank.savePaper(Object.assign({}, editing, f, { __new: undefined }))); if (r) done('حُفظ الامتحان'); return; }
      case 'set-new': editing = { __new: true, book: defBook(), kind: section === 'monthly' ? 'monthly' : 'chapter_end' }; pick = new Set(); return render();
      case 'set-edit': { const s = Bank.sets({}).find(x => x.id === id); editing = JSON.parse(JSON.stringify(s)); pick = new Set(s.items); return render(); }
      case 'set-save': { const r = await act(saveSet); if (r) done('حُفظ الاختبار كمسودة'); return; }
      case 'set-publish': return act(() => Bank.publishSet(id, true), r => r.status === 'published' ? 'نُشر الاختبار للطلاب' : 'الخادم أبقاه: ' + STATUS_AR[r.status]);
      case 'set-hide': return act(() => Bank.publishSet(id, false), 'أُخفي الاختبار');
      case 'cat-new': editing = { __new: true, book: defBook() }; return render();
      case 'cat-edit': editing = JSON.parse(JSON.stringify(Catalog.get(section, id))); return render();
      case 'cat-save': case 'cat-save-pub': { const r = await act(() => saveCatalog(d === 'cat-save-pub')); if (r) done('حُفظ — الحالة: ' + STATUS_AR[r.status]); return; }
      case 'cat-publish': { const r0 = Catalog.get(section, id); return act(() => Catalog.setStatus(section, id, 'published', section === 'videos' ? structureOf(r0.book) : null), 'نُشر'); }
      case 'cat-hide': return act(() => Catalog.setStatus(section, id, 'hidden', null), 'أُخفي');
      case 'cat-del': if (confirm('حذف؟')) return act(() => Catalog.remove(section, id), 'حُذف'); return;
      case 'rel-publish': { const r = await act(publishRelease); if (r) msg((mode === 'cloud' ? 'نُشر الإصدار ' : 'أُنشئ الإصدار ') + r.manifest.id + (r.sig ? ' موقّعًا' : ' — غير موقّع')); return; }
      case 'key-import': $('#keyFile').click(); return;        // no re-render: the file input must survive until a file is chosen
      case 'key-new': case 'key-backup': case 'key-public': { const m = await act(() => keyAction(d)); if (typeof m === 'string') msg(m); return; }
      case 'backup': backup(); return msg('نُزّلت النسخة الاحتياطية');
      case 'role-save': {
        const role = row.querySelector('[data-role]').value, grants = role === 'admin' ? [...row.querySelectorAll('[data-grant]:checked')].map(x => x.dataset.grant) : [];
        return act(async () => { const p = await Cloud.patch('profiles', 'user_id', id, { role, grants }); profiles = profiles.map(x => x.user_id === id ? p : x); }, 'حُفظت صلاحيات الحساب');
      }
    }
  }

  async function init() {
    const seed = id => { const el = document.getElementById(id); return el ? JSON.parse(el.textContent) : null; };
    seeds = { bank: seed('seed-bank'), booklets: seed('seed-booklets') };
    await Content.init(seed('seed-pack'));
    await Cloud.load();
    if (Cloud.config && Cloud.session) { try { return await startCloud(); } catch (e) { return showLogin(e.message); } }
    return Cloud.config ? showLogin() : showConnect();
  }
  const api = { init, render, go(s) { section = s; editing = null; pick = new Set(); render(); }, get mode() { return mode; } };
  window.__adm = { Admin: api, Bank, Catalog, Booklets, Perm, Release, Content, Cloud, Sign, get lastRelease() { return lastRelease; }, get signKey() { return signKey; }, get health() { return health; } };
  return api;
})();
document.addEventListener('DOMContentLoaded', () => Admin.init());

</script></body></html>
