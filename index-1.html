"n":22,"title":"طاقة كبس الحرة القياسية للتفاعل","page":39,"top":549.7,"topic":"c1t7","anchored":true},{"id":"c1l23","chapter":"c1","n":23,"title":"حساب انتروبي التغيرات الفيزيائية","page":44,"top":383.7,"topic":"c1t6","anchored":true},{"id":"c1lq","chapter":"c1","n":99,"title":"أسئلة الفصل","page":46,"top":0.0,"topic":null,"anchored":true}],"blocks":[{"id":"b1831f26891","p":9,"k":"paragraph","b":[268.1,54.9,552.8,84.9],"x":"الفصل الاول الثرموداينمك","ln":[[268.1,54.9,552.8,84.9,0,24]],"l":"c1l00"},{"id":"b52d43f4ee7","p":9,"k":"formula","b":[42.4,84.8,267.9,118.7],"x":"Thermodynamics","ln":[[42.4,84.8,267.9,118.7,0,14]],"l":"c1l00"},{"id":"b857fea471f","p":9,"k":"formula","b":[471.0,101.4,505.6,173.4],"x":"1","ln":[[471.0,101.4,505.6,173.4,0,1]],"l":"c1l00"},{"id":"b72c67c2834","p":9,"k":"paragraph","b":[39.4,454.2,535.8,567.9],"x":"بعد الإنتهاء من دراسة هذا الفصل يتوقع من الطالب أن: يُعَرِف علم الثرموداينمك، الطاقة، وحدات الطاقة، النظام، المحيط، المجموعة، انواع الانظمة. يتعرف على مصطلحات الحرارة، السعة الحرارية، الحرارة النوعية، حرارة التفاعل المقاسة تحت ضغط ثابت. يتعلم ماذا تعني الانثالبي وما هي علاقتها مع حرارة التفاعل وهل هي دالة حالة من الخواص الشاملة ام المركزة وما هي وحداتها.","ln":[[220.1,454.2,535.8,474.2,0,51],[107.2,479.9,534.7,500.9,52,88],[42.4,503.9,534.8,524.9,141,95],[39.4,527.9,534.8,548.9,237,103],[456.3,551.9,535.8,567.9,341,15]],"l":"c1l00"},{"id":"bddd60f6115","p":9,"k":"paragraph","b":[39.4,575.9,535.8,663.9],"x":"يحدد هل ان التفاعل باعث للحرارة ام ماص للحرارة وربط هذا مع اشارة التغير في انثالبي التفاعل. يكتب المعادلة الحرارية مُحدَدَاً بشروط كتابتها ويبين اختلافها عن المعادلة الكيميائية. يميز بين انثالبي التفاعل القياسية وانثالبي التكوين القياسية وانثالبي الاحتراق القياسية ويتمكن من استخراج قيمها من بعضها.","ln":[[82.7,575.9,534.7,596.9,0,91],[144.1,599.9,534.7,620.9,92,85],[39.4,623.9,534.7,644.9,178,104],[453.5,647.9,535.8,663.9,283,15]],"l":"c1l00"},{"id":"bed2280e830","p":9,"k":"paragraph","b":[39.4,671.9,535.8,759.9],"x":"يتعرف على الطرق المستخدمة لحساب انثالبي التفاعل يميز بين العمليات التلقائية وغير التلقائية ويتعرف على دالة الانتروبي وطاقة كبس الحرة. يتعلم حساب انتروبي التفاعل القياسية من قيم الانتروبي المطلقة وحساب طاقة كبس الحرة للتفاعل القياسية من قيم طاقة كبس الحرة للتكوين القياسية.","ln":[[284.8,671.9,534.7,692.9,0,47],[124.4,695.9,534.7,716.9,48,85],[39.4,719.9,534.7,740.9,134,98],[339.4,743.9,535.8,759.9,233,39]],"l":"c1l00"},{"id":"b630466ae0a","p":9,"k":"paragraph","b":[39.4,767.9,535.8,807.9],"x":"يفهم معادلة كبس ويبين طريقة استخدامها لمعرفه اتجاه سير التفاعلات الكيميائية بالاعتماد على قيم الانثالبي والانتروبي، ويشتق علاقه تروتن.","ln":[[39.4,767.9,534.7,788.9,0,103],[382.0,791.9,535.8,807.9,104,30]],"l":"c1l00"},{"id":"bf3f9afd9db","p":10,"k":"heading","b":[249.5,52.5,382.7,74.3],"x":"1-1 مقدمة","ln":[[249.5,52.5,382.7,74.3,0,9]],"l":"c1l01"},{"id":"b1b577a745a","p":10,"k":"paragraph","b":[39.5,80.1,382.7,303.1],"x":"تعرفنا في دراستنا السابقة على عدة انواع من الطاقة مثل الطاقة الحرارية والطاقة الكهربائية والطاقة الميكانيكية والطاقة الضوئية والطاقة النووية والطاقة الكيميائية...الخ، ان هذه الانواع المختلفة من الطاقات تكون مخزونة في جميع المواد وتظهر عند تحولها من شكل الى آخر. يوحي الاختلاف في اشكال الطاقة ان كلاً منها قائم بحد ذاته ولا يوجد بينها علاقة، الا ان هذا غير صحيح، لانه تحت ظروف معينة يمكن تحويل الطاقة من شكل الى آخر. الثروموداينمك علم يهتم بدراسة الطاقة وتحولاتها ويهدف نحو تحويل اكبر قدر ممكن من الطاقة الحرارية الناتجة من احتراق الوقود الى انواع اخرى من الطاقات مثل الطاقة الميكانيكية للاستفادة منها في عمل المحركات. يفسر علم الثرموداينمك ظواهر عديدة اهمها:","ln":[[39.5,80.1,365.6,96.1,0,69],[39.5,103.1,382.7,119.1,70,70],[39.5,126.1,382.6,142.1,141,72],[39.5,149.1,382.7,165.1,214,64],[39.5,172.0,382.7,188.1,279,72],[43.6,195.1,382.7,211.1,352,63],[39.5,218.1,365.7,234.1,416,62],[39.5,241.1,382.6,257.1,479,72],[39.5,264.1,382.7,280.1,552,70],[198.1,287.1,382.7,303.1,623,35]],"l":"c1l01"},{"id":"be8d0702ab3","p":10,"k":"list_item","b":[197.1,306.8,382.7,326.1],"x":"1- سبب حدوث التفاعلات الكيميائية.","ln":[[197.1,306.8,382.7,326.1,0,33]],"l":"c1l01"},{"id":"bed9767bce2","p":10,"k":"list_item","b":[39.5,329.8,382.7,349.1],"x":"2- التنبؤ بحدوث التغيرات الكيميائية والفيزيائية عندما توجد مادة او","ln":[[39.5,329.8,382.7,349.1,0,66]],"l":"c1l01"},{"id":"b2aae0a308b","p":10,"k":"paragraph","b":[255.0,356.1,365.7,372.1],"x":"اكثر تحت ظروف معينة.","ln":[[255.0,356.1,365.7,372.1,0,20]],"l":"c1l01"},{"id":"bb56295290f","p":10,"k":"list_item","b":[39.5,375.8,382.7,395.2],"x":"3- حدوث بعض التفاعلات تلقائيا واخرى لا تحدث ابداً بشكل تلقائي عند","ln":[[39.5,375.8,382.7,395.2,0,65]],"l":"c1l01"},{"id":"b614f26ef89","p":10,"k":"paragraph","b":[296.6,402.1,365.7,418.1],"x":"نفس الظروف.","ln":[[296.6,402.1,365.7,418.1,0,11]],"l":"c1l01"},{"id":"b40d9993856","p":10,"k":"list_item","b":[39.5,421.8,382.7,441.1],"x":"4- سبب حدوث الطاقة المصاحبة للتفاعلات الكيميائية سواء في التفاعلات","ln":[[39.5,421.8,382.7,441.1,0,66]],"l":"c1l01"},{"id":"b5019c62651","p":10,"k":"paragraph","b":[39.5,448.1,382.7,602.1],"x":"نفسها او في الوسط المحيط بها. ومن ناحية اخرى، لا يهتم علـــــــــــــم الثرموداينمك بعامل الزمن الذي يســــــــتغرقه حدوث التفاعلات، فهو ينبئ فقط فيما اذا كان تفاعل معين (او اي تغير بصورة عامة) قابل للحدوث او غيــــــــــــر قابل للحدوث، دون ان يبين ســــــــــــــرعة حدوث هذا التغيير، لان سرعة حدوث التفاعل من اهتمام علم الحركيات الذي درسناه في المرحلة الخامسة. يمكن تقسيم الطاقة بشكل عام الى قسمين رئيسين هما الطاقة الكامنة","ln":[[223.1,448.1,365.7,464.1,0,29],[39.5,471.1,365.6,487.1,30,65],[39.5,494.1,382.7,510.1,96,62],[39.5,517.1,382.7,533.1,159,70],[39.5,540.1,382.6,556.1,230,65],[42.5,563.1,382.7,579.1,296,67],[39.5,586.1,365.6,602.1,364,62]],"l":"c1l01"},{"id":"b1c12742d14","p":10,"k":"formula","b":[39.5,605.8,382.7,625.1],"x":"(Potential Energy) والطاقة الحركية (Kinetic Energy).","ln":[[39.5,605.8,382.7,625.1,0,52]],"l":"c1l01"},{"id":"b4c03f58559","p":10,"k":"paragraph","b":[39.5,632.1,382.7,811.4],"x":"تشمل الطاقة الكامنة الطاقة الكيميائية المخزونة في جميع انواع المواد وجميع انواع الوقود. اما بالنسبة للطاقة الحركية فهي تشمل طاقة جميع الاجسام المتحركة مثل الجزيئات والماء المتحرك وكذلك السيارات والطائرات والصواريخ وغيرها. فعلى سبيل المثال، تتحول الطاقة الكامنة في الماء الى طاقة حركية اذا تمت حركة الماء من اعلى الشلال الى اسفله لان الطاقة الناتجة يمكن ان تدور المحرك لتوليد الطاقة الكهربائية. لذا ينص القانون الاول في علم الثرموداينمك على ان “الطاقة لا تفنى ولا تستحدث من العدم ولكن يمكن تحويلها من شكلٍ الى آخر”.","ln":[[39.5,632.1,382.6,648.1,0,67],[39.5,655.1,382.7,671.1,68,65],[39.5,678.1,382.7,694.1,134,69],[39.5,701.1,382.7,717.1,204,69],[39.5,724.1,382.6,740.1,274,73],[39.5,747.1,382.7,763.1,348,70],[39.5,766.8,382.7,786.1,419,64],[229.4,789.8,382.7,811.4,484,30]],"l":"c1l01"},{"id":"b9c410e49ca","p":11,"k":"heading","b":[250.1,51.4,552.8,73.2],"x":"2-1 وحدات الطاقة ودرجة الحرارة","ln":[[250.1,51.4,552.8,73.2,0,30]],"l":"c1l02"},{"id":"bab935394d6","p":11,"k":"paragraph","b":[58.9,80.0,552.8,152.3],"x":"ان الوحدات المستخدمة للتعبير عن الطاقة حسب النظام الدولي للوحدات هل تعلم (SI) هي الجول (Joule) ورمزه (J) ويعبر عنه حسب الاتي: ان كل دقة قلب تستهلك 1J من الطاقة.","ln":[[136.6,80.0,535.8,98.3,0,72],[261.3,100.7,552.8,120.0,73,52],[58.9,120.3,169.9,134.3,126,20],[124.4,135.4,187.0,152.3,147,13]],"l":"c1l02"},{"id":"b7ef8b8dbfd","p":11,"k":"formula","b":[336.3,145.3,446.0,168.0],"x":"1 J = 1 kg . m2/s2","ln":[[336.3,145.3,446.0,168.0,0,18]],"l":"c1l02"},{"id":"b4ae272ff54","p":11,"k":"paragraph","b":[209.6,196.7,552.8,240.0],"x":"حيث kg وحدة الكيلوغرام (kilogram) و m وحدة المتـر (meter) و s وحدة الثانية (second).","ln":[[209.6,196.7,552.8,216.0,0,57],[409.5,220.7,552.8,240.0,58,26]],"l":"c1l02"},{"id":"be30ff568c0","p":11,"k":"paragraph","b":[43.5,263.9,552.8,360.0],"x":"انتبه ! كما ان وحدات درجة الحرارة المستخدمة في الثرموداينمك هي الكلفن يجب التفريق بين وحدة المتر (K) وتحسب من درجة الحرارة بالوحدات السيليزيةC̊ باستخدام العلاقة (m) و الكتلة (m) المعروفة الاتية:","ln":[[133.4,263.9,193.9,293.9,0,7],[43.5,296.0,535.7 من عناصره الاساسية المتواجدة بأثبت صورها في الظروف القياسية C̊ 25 وضغط 1atm. ونعني العناصر بأثبت صورها اي حالتها القياسية عند الظروف القياسية المشار اليها. فالهيدروجين تكون حالته الغازية هي الصورة الاثبت والزئبق السائل والمغنسيوم الصلب هي الصور الاثبت لانها تمثل الحالات الموجودة تحت الظروف القياسية C̊ 25 وضغط 1atm. توجد لبعض العناصر اكثر من صورة في الظروف القياسية، مثال ذلك فعنصر الكاربون يمكن ان يوجد على شكل كرافيــــت (graphite) وماس (diamond)، ولكن يعتبر الكرافيت هو الصورة الاثبت، والكبريت يمكن ان يوجد على صورة كبريت معينـــــي (Srhombic) وكبريت موشـــــــــــوري (Sorthorhombic) لكن المعيني هو الاثبت. ومن المتفق عليه (حسب الاتحاد الدولي للكيمياء الصرفة والتطبيقية IUPAC) ان قيمة ̊Hf∆ لجميع العناصر في حالتها القياسية (اثبت صورة للعنصر) تساوي صفراً.","ln":[[39.5,208.5,365.7,231.5,0,58],[39.5,239.5,382.7,255.5,59,65],[39.5,263.5,382.7,279.5,125,63],[39.5,284.3,382.7,303.9,189,58],[39.5,311.5,382.7,327.5,248,69],[39.5,335.5,382.6,351.5,318,65],[39.5,353.9,382.6,375.5,384,66],[39.5,380.3,382.7,399.5,451,51],[39.5,407.5,382.6,423.5,503,65],[39.5,427.5,382.7,447.5,569,56],[39.5,452.3,382.6,471.5,626,66],[76.9,476.3,382.7,495.5,693,63],[39.5,503.5,365.7,519.5,757,62],[39.5,520.5,382.7,543.5,820,58],[243.1,551.5,382.7,567.7,879,25]],"l":"c1l13"},{"id":"baa48f1acec","p":22,"k":"formula","b":[59.5,592.5,241.2,615.5],"x":"Element( = 0 kJ/mol) ̊H∆ f","ln":[[59.5,592.5,241.2,615.5,0,24],[85.7,605.3,88.8,614.6,25,1]],"l":"c1l13"},{"id":"b48e2667e2a","p":22,"k":"paragraph","b":[207.4,620.3,382.7,639.7],"x":"حيث ان (Element) تعني عنصراً.","ln":[[207.4,620.3,382.7,639.7,0,29]],"l":"c1l13"},{"id":"b58c79f1022","p":22,"k":"paragraph","b":[39.5,671.5,386.2,713.8],"x":"فطالما ان الاوكسجين الغاز هو أثبت صورة للاوكســــــــجين فقيمة O( = 0 kJ/mol)̊H∆ وكاربـــــــــــــــــــــون الكرافــــــــــــــــيت","ln":[[39.5,671.5,382.6,687.5,0,62],[39.5,690.7,386.2,713.8,63,71]],"l":"c1l13"},{"id":"ba6b80a73e6","p":22,"k":"formula","b":[269.0,703.5,302.0,713.4],"x":"f2","ln":[[269.0,703.5,302.0, ,"l":"c1l17"},{"id":"b4e14cffbba","p":27,"k":"paragraph","b":[209.6,679.7,553.1,741.7],"x":"هنالك العديد من المركبات الكيميائية لا يمكن تصنيعها بشكل مباشر من عناصرها وذلك لاسباب عديدة منها ان التفاعل قد يسير ببطء شديد او تكون مركبات جانبية غير مرغوبة. لذا يتم اللجوء الى قياس̊ H∆ لهذه التفاعلات","ln":[[209.6,679.7,536.0,695.7,0,65],[209.6,702.7,553.1,718.7,66,67],[209.6,720.8,553.1,741.7,134,68]],"l":"c1l17"},{"id":"b71bafb1604","p":27,"k":"formula","b":[307.4,733.6,311.1,742.9],"x":"r","ln":[[307.4,733.6,311.1,742.9,0,1]],"l":"c1l17"},{"id":"b91db9af501","p":27,"k":"paragraph","b":[209.6,745.5,553.1,810.7],"x":"بطريقة غير مباشرة، وتعتمد هذه الطريقة على قانون هيس (Hess law) الذي ينص على ان “عند تحويل المتفاعلات الى نواتج فان التغير في انثالبي التفاعل هو نفسه سواء تم التفاعل في خطوة واحدة او في سلسلة من الخطوات”.","ln":[[209.6,745.5,553.1,764.7,0,62],[209.6,768.5,553.1,787.7,63,69],[209.6,791.5,553.1,810.7,133,70]],"l":"c1l17"},{"id":"b1212c28831","p":28,"k":"paragraph","b":[39.7,51.6,384.9,273.8],"x":"وبكلمات اخرى، اذا استطعنا تجزئة التفاعل الى سلسلة من تفاعلات يمكن قياس ̊Hr∆ لها، فانه يمكن حساب ̊Hr∆ للتفاعل الكلي. يعتمد قانون هيس على حقيقة ان̊ Hr∆ هي دالة حالة اي انها تعتمد على الحالة الابتدائية والحالة النهائية للنظام فقط (اي على طبيعة المتفاعلات والنواتج). ولاتعتمد على المسارات التي يسلكها التفاعل للتحول من المواد المتفاعلة الى المواد الناتجة. ويمكن تمثيل قانون هيس بالطاقة التي يصرفها المصعد عند الانتقال من الطابق الاول للسادس في عمارة مباشرة او توقفه عند كل طابق خلال صعوده. فعلى سبيل المثال، لا يمكن قياس الحرارة المنبعثة مباشرة عندما يتفاعل الكاربون (كرافيت) مع الاوكسجين ليكونا احادي اوكسيد الكاربون: ـ1ـــ","ln":[[39.7,51.6,382.7,66.6,0,70],[39.7,68.2,384.9,90.3,71,64],[39.7,90.2,382.7,112.3,136,79],[39.7,117.6,382.7,132.6,216,73],[39.7,139.6,382.6,154.6,290,79],[39.7,161.6,382.6,176.6,370,69],[161.4,183.6,382.7,198.6,440,45],[39.7,205.6,365.6,220.6,486,76],[122.1,227.6,382.7,242.6,563,51],[108.8,248.5,119.3,273.8,615,5]],"l":"c1l17"},{"id":"be00210818d","p":28," تلقائية الفيزيائية والكيميائية هي الاتي: \u001a سقوط الماء من اعلى الشلال، ولكن صعوده اليه مستحيل.","ln":[[39.5,76.1,462.1,94.3,0,80],[39.5,102.3,382.7,118.3,81,62],[39.5,126.3,382.6,142.3,144,61],[43.4,147.1,382.7,166.4,206,59],[98.1,174.3,382.7,190.3,266,61],[107.5,198.3,382.7,214.3,328,52]],"l":"c1l19"},{"id":"baf3e0debf8","p":32,"k":"figure_label","b":[471.1,212.3,546.1,225.3],"x":"عمليات غير تلقائية","ln":[[471.1,212.3,546.1,225.3,0,18]],"l":"c1l19"},{"id":"b229e9f87c5","p":32,"k":"paragraph","b":[39.5,222.3,528.8,478.4],"x":"\u001a انتقال الحرارة من الجسم الحار الى الجسم البارد، ولكن عكس ذلك لايحدث مطلقاً. \u001a ذوبان قطعة السكر تلقائياً في كوب القهوة، ولكن السكر المذاب لايتجمع العمليات التلقائية وغير التلقائيةتلقائياً كما في شكله الابتدائي. \u001a انجماد الماء النقي تلقائياً تحت C̊ 0 وينصهر الجليد تلقائياً فوق C̊ 0 (عند ضغط 1atm). \u001a يصدأ الحديد تلقائياً عندما يتعرض للاوكسجين وللرطوبة (الماء)، ولكن صدأ الحديد لا يمكن ان يتحول تلقائياً الى حديد. \u001a تتفاعل قطعة الصوديوم Na بشدة مع الماء مكونة NaOH وهيدروجين H2، ولكن H2 لايتفاعل مع NaOH ليكون الماء والصوديوم. \u001a يتمدد الغاز تلقائياً في الاناء المفرغ من الهواء، ولكن تجمع جزيئات الغاز","ln":[[39.5,222.3,382.7,238.3,0,69],[333.1,246.3,365.7,262.4,70,7],[39.5,270.3,382.7,286.4,78,68],[220.0,293.5,528.8,310.4,147,64],[39.5,314.1,382.7,334.4,212,70],[257.6,339.1,365.7,358.3,283,15],[39.5,366.3,382.7,382.4,299,67],[145.0,390.3,365.7,406.4,367,46],[39.5,411.1,382.7,430.3,414,60],[78.1,435.1,365.7,455.9,475,51],[39.5,462.3,382.7,478.4,527,73]],"l":"c1l19"},{"id":"bca1df2eb5d","p":32,"k":"formula","b":[463.1,474.2,477.0,487.2],"x":"(أ)","ln":[[463.1,474.2,477.0,487.2,0,3]],"l":"c1l19"},{"id":"b4ca93d4c0d","p":32,"k":"paragraph","b":[39.5,483.1,382.7,622.5],"x":"جميعها في وعاء واحد يعد عملية غير تلقائية، لاحظ الشكل (4-1). توضح هذه الامثلة ان العمليات التي تجري تلقائياً بأتجاه معين لايمكنها ان تجري بشكل تلقائي بالاتجاه المعاكس في ظل الظروف نفسها. لنسأل ماهو السبب الذي يجعل بعض العمليات تحدث تلقائياً. ان احد الاجوبة المقنعة لهذا السؤال هو ان جميع العمليات التلقائية يرافقها انخفاض في طاقة النظام الكلية (طاقة اقل تعني اكثر استقراراً)،","ln":[[42.5,483.1,365.7,502.3,0,60],[39.5,510.3,382.7,526.4,61,71],[106.6,534.3,382.7,550.3,133,53],[82.3,558.3,365.7,574.4,187,54],[39.5,582.3,365.6,598.3,242,64],[39.5,606.3,382.6,622.5,307,68]],"l":"c1l19"},{"id":"b7d3afe2bfe","p":32,"k":"formula","b":[459.8,617.8,480.5,630.9],"x":"(ب)","ln":[[459.8,617.8,480.5,630.9,0,3]],"l":"c1l19"},{"id":"b2ad4daac08","p":32,"k":"paragraph","b":[39.5,630.3,547.5,766.3],"x":"اي: ان الطاقة النهائية اقل من الطاقة الابتدائية للنظام، وهذا يوضح سبب الشكل 4-1 انتقال الحرارة من الجسم الساخن الى الجسم البارد، وسبب سقوط الماء من (أ) يتمدد الغاز تلقائياً في اعلى الشلال. الاناء المفرغ من الهـــــــــواء (ب) تجمع جزيئات الغاز جميعها في يلاحظ ان اغلب التفاعلات التي يرافقها انخفاض في الطاقة اي الانثالبي، وعاء واحد يعد عملية غير تلقائية.كما هو الحال في التفاعلات الباعثة للحرارة تحدث تلقائياً عند الظروف القياسية مثل احتراق الميثان.","ln":[[39.5,630.3,382.6,646.3,0,69],[39.5,647.0,547.5,670.3,70,77],[394.8,668.6,532.9,683.1,148,27],[316.1,678.3,382.7,694.3,176,12],[394.8,687.2,547.5,701.6,189,36],[39.5,702.3,547.5,720.2,226,95],[39.5,724.4,547.5,742.4,322,98],[252.4,750.3,382.7,766.3,421,28]],"l":"c1l19"},{"id":"bf5ef47cfa1","p":32,"k":"formula","b":[44.2,763.4,401.9,786.6],"x":"890 kJ - = ̊CH4(g) + 2O2(g) CO2(g) + 2H2O(l) ∆Hr","ln":[[44.2,763.4,401.9,786.6,0,48]],"l":"c1l19"},{"id":"bdf0e41c4c9","p":33,"k":"paragraph","b":[369.9,51.4,535.8,67.4],"x":"وتفاعلات تعادل الحامض مع القاعدة","ln":[[369.9,51.4,535.8,67.4,0,32]],"l":"c1l19"},{"id":"bb2e4cbcf21","p":33,"k":"formula","b":[229.6,80.5,542.8,103.0],"x":"56 kJ- = ̊H(aq( + OH)aq) H2O(l) ∆H -+ r","ln":[[229.6,80.5,542.8,103.0,0,34],[242.1,81.4,348.7,92.3,35,2],[479.7,93.3,483.5,102.6,38,1]],"l":"c1l19"},{"id":"b6eef77121a","p":33,"k":"paragraph","b":[209.6,133.4,552.8,173.5],"x":"ولكن هل ان هذا الافتراض يقودنا للقول ان اي تفاعل تلقائي يجب ان يكون باعثاً للحرارة؟","ln":[[209.6,133.4,535.7,149.4,0,62],[456.7,157.4,552.8,173.5,63,20]],"l":"c1l19"},{"id":"bcd62f771b5","p":33,"k":"paragraph","b":[514.8,191.4,552.8,207.4],"x":"الجواب:","ln":[[514.8,191.4,552.8,207.4,0,7]],"l":"c1l19"},{"id":"b8f39ca6e80","p":33,"k":"paragraph","b":[209.6,225.4,552.8,347.4],"x":"لايمكن تعميم هذا الافتراض وذلك لسبب بسيط جداً هو ان هنالك بعض التغيرات الفيزيائية والكيميائية تكون ماصة للحرارة وتحدث تلقائياً، وعلى سبيل المثال: \u001a ذوبان كلوريد الامونيوم NH4Cl في الماء يحدث تلقائياً وهو عملية ماصة للحرارة.","ln":[[209.6,225.4,535.7,241.5,0,61],[209.6,249.4,552.7,265.5,62,70],[496.0,273.4,552.8,289.4,133,12],[209.6,304.1,552.8,323.5,146,63],[485.1,331.4,552.8,347.4,210,13]],"l":"c1l19"},{"id":"becff69dafb","p":33,"k":"formula","b":[229.6,360.5,541.4,383.0],"x":"14 kJ + = ̊NH4Cl(s) NH+4(aq( + Cl-)aq) ∆H r","ln":[[229.6,360.5,541.4,383.0,0,41],[473.3,373.3,477.1,382.6,42,1]],"l":"c1l19"},{"id":"b6a60852a66","p":33,"k":"paragraph","b":[209.6,410.1,552.8,453.4],"x":"\u001a وتفكك اوكسيد الزئبق HgO هو تفاعل تلقائي وهو تفاعل ماص للحرارة.","ln":[[209.6,410.1,552.8,429.4,0,55],[512.2,437.4,552.8,453.4,56,8]],"l":"c1l19"},{"id":"b86036b62ce","p":33,"k":"formula","b":[229.6,466.5,506.5,489.0],"x":"91 kJ = ̊2HgO(s) 2Hg(l) + O2(g) ∆H r","ln":[[229.6,466.5,506.5,489.0,0,34],[450.9,479.3,454.7,488.6,35,1]],"l":"c1l19"},{"id":"be14aa66314","p":33,"k":"paragraph","b":[209.6,495.4,552.8,535.4],"x":"\u001a وانصهار الجليد في درجة حرارة الغرفة عملية تلقائية بالرغم من ان العملية ماصة للحرارة.","ln":[[209.6,495.4,552.8,511.4,0,72],[485.1,519.4,552.8,535.4,73,13]],"l":"c1l19"},{"id":"b738bd903ac","p":33,"k":"formula","b":[229.6,550.1,465.2,571.0],"x":"H2O(s) H2O(l) ∆Hfus = 6 kJ/mol","ln":[[229.6,550.1,465.2,571.0,0,30]],"l":"c1l19"},{"id":"bdda4e7c17d","p":33,"k":"paragraph","b":[272.1,601.4,552.8,617.5],"x":"\u001a وتبخر الماء عملية ماصة للحرارة لكنها تحدث تلقائياً ايضاً.","ln":[[272.1,601.4,552.8,617.5,0,59]],"l":"c1l19"},{"id":"b2951e546b5","p":33,"k":"formula","b":[229.6,632.1,475.1,653.0],"x":"H2O(l) H2O(g) ∆Hvap = 44 kJ/mol","ln":[[229.6,632.1,475.1,653.0,0,31]],"l":"c1l19"},{"id":"bd00c260143","p":33,"k":"paragraph","b":[209.6,659.4,552.8,771.4],"x":"ومما تقدم يمكن القول انه من الممكن حدوث تفاعل ماص للحرارة تلقائياً، ويمكن لتفاعل باعث للحرارة ان يكون غير تلقائي. او بكلمات اخرى، لايمكننا ان نقرر بشكل مطلق فيما اذا كان التفاعل يجري ام لا يجري بشكل مبسط اذا كان باعثاً او ماصاً للحرارة. ولعمل هذا النوع من التوقع نحتاج الى دالة ثرموداينمكية جديدة تسمى بالانتروبي.","ln":[[209.6,659.4,552.7,675.5,0,67],[209.6,683.4,552.7,699.4,68,61],[209.6,707.4,552.7,723.4,130,68],[209.6,731.4,552.8,747.5,199,73],[347.0,755.4,552.8,771.4,273,40]],"l":"c1l19"},{"id":"b32fb3e984f","p":34,"k":"heading","b":[150.3,46.9,382.7,68.6],"x":"15-1 الانتروبي Entropy","ln":[[150.3,46.9,382.7,68.6,0,22]],"l":"c1l20"},{"id":"b06d4ac31ea","p":34,"k":"paragraph","b":[39.5,89.4,507.2,278.4],"x":"من اجل التنبؤ بتلقائية عملية ما نحتاج الى ادخال دالة ثرموداينمكية جديدة تسمى الانتروبي ويرمز لها بالرمز (S) والتي تعرف بانها مقياس للعشوائية او لاانتظام النظام. فالانتروبي دالة ثرموداينمكية تصف الى اي مدى تصل درجة لا انتظام النظام. فكلما كان الانتظام قليلاً في النظام (عشوائية اكبر) كانت قيمة الانتروبي كبيرة. وكلما كان النظام اكثر ↓S ↑انتظامانتظاماً (اقل عشوائية) كانت قيمة الانتروبي صغيرة. ان الانتروبي دالة حالة شأنها شأن الانثالبي حيث تم حسابها نظرياً وتكاد تكون قريبة للقيمة الحقيقية ويقاس التغير الحاصل في الانتروبي.","ln":[[39.5,89.4,365.7,105.4,0,65],[39.5,110.1,382.7,129.4,66,64],[39.5,137.4,382.7,153.4,131,66],[39.5,161.3,382.7,177.4,198,69],[39.5,185.4,382.7,201.4,268,63],[137.0,206.8,507.2,230.9,332,59],[39.5,238.4,365.6,254.5,392,69],[89.1,262.4,382.7,278.4,462,60]],"l":"c1l20"},{"id":"b455bfa6f1b","p":34,"k":"formula","b":[59.5,283.1,245.7,302.4],"x":"S = Sf - Si∆","ln":[[59.5,283.1,245.7,302.4,0,12]],"l":"c1l20"},{"id":"b9ecbcace53","p":34,"k":"paragraph","b":[39.5,306.4,365.7,326.4],"x":"حيث S الانتروبي النهائية (f من final وتعني نهائي)، و S الانتروبي","ln":[[39.5,306.4,365.7,326.4,0,64]],"l":"c1l20"},{"id":"bce69e4fa40","p":34,"k":"formula","b":[96.0,316.7,338.7,326.1],"x":"if","ln":[[96.0,316.7,338.7,326.1,0,2]],"l":"c1l20"},{"id":"bfcfd1ceb20","p":34,"k":"paragraph","b":[39.5,331.1,382.7,374.4],"x":"الابتدائية (i من initial وتعني ابتدائي). ان جميع التفاعلات الكيميائية والتحولات الفيزيائية السابقة والتي","ln":[[186.9,331.1,382.7,350.4,0,40],[39.5,358.4,382.6,374.4,41,63]],"l":"c1l20"},{"id":"be7fe3216ab","p":34,"k":"paragraph","b":[396.6,364.6,546.5,388.6],"x":"↑S ↑لاانتظام (عشوائية)","ln":[[396.6,364.6,546.5,388.6,0,22]],"l":"c1l20"},{"id":"b932f957330","p":34,"k":"paragraph","b":[39.5,382.4,382.7,422.5],"x":"تجري بشكل تلقائي يرافقها دائماً زيادة في اللا أنتظام (اي زيادة في قيمة الانتروبي). فكلوريد الامونيوم يذوب في الماء تلقائياً.","ln":[[39.5,382.4,382.7,398.5,0,70],[135.9,406.4,382.7,422.5,71,53]],"l":"c1l20"},{"id":"bbe43df3d97","p":34,"k":"formula","b":[42.5,431.5,356.0,454.0],"x":"14 kJ + = ̊NH4Cl(s) NH+4(aq( + Cl-)aq) ∆H r","ln":[[42.5,431.5,356.0,454.0,0,41],[287.7,444.3,291.5,453.6,42,1]],"l":"c1l20"},{"id":"b4adea7b9d7","p":34,"k":"paragraph","b":[39.5,466.4,382.7,794.4],"x":"يصاحب عملية الذوبان هذه تكون ايونات في المحلول المائي التي هي اقل انتظاماً من جزيئات كلوريد الامونيوم الصلب. وعندما يتبخر الماء السائل، تكون جزيئات البخار اقل انتظاماً من جزيئات الماء السائل التي بدورها تكون اقل انتظاماً من جزيئات الجليد. وبشكل عام فإن انتروبي الحالة الغازية تكون دائماً اكبر من انتروبي الحالة السائلة التي بدورها تكون اكبر من قيمة انتروبي الحالة الصلبة، لاحظ الشكل (5-1). تحدث الزيادة في انتروبي النظام نتيجة للزيادة في طاقة التشتت، والان سندرس عدداً من العمليات التي تقود الى تغير في انتروبي النظام بدلالة التغير في حالات النظام. ففي عملية الانصهار تكون الذرات او الجزيئات في الحالة الصلبة محصورة في مواقع ثابتة. وعند الانصهار فان هذه الذرات او الجزيئات تبدأ بالحركة لذا تتحرك خارج الشبكة البلورية مما يزيد من عشوائيتها لذا يحدث انتقال في الطور من الانتظام الى اللاانتظام يصاحبه زيادة في الانتروبي. وبشكل مشابه، نتوقع ان تؤدي عملية التبخر الى زيادة في انتروبي النظام كذلك.","ln":[[39.5,466.4,365.6,482.4,0,65],[39.5,490.4,382.7,506.5,66,69],[39.5,514.4,382.7,530.5,136,71],[39.5,538.4,382.7,554.5,208,72],[39.5,562.4,382.7,578.5,281,75],[208.8,583.1,382.7,602.4,357,32],[39.5,610.4,365.7,626.4,390,66],[39.5,634.4,382.7,650.5,457,67],[270.2,658.4,382.7,674.4,525,23],[39.5,682.4,365.7,698.4,549,66],[39.5,706.4,382.7,722.4,616,69],[39.5,730.4,382.7,746.4,686,68],[39.5,754.4,382.6,770.4,755,68],[39.5,778.4,382.7,794.4,824,67]],"l":"c1l20"},{"id":"b79647a28aa","p":35,"k":"paragraph","b":[209.6,51.4,552.8,403.4],"x":"ان هذه الزيادة اكبر من تلك التي في عملية الانصهار، بسبب ان الذرات والجزيئات في الطور الغازي تنتشر بشكل عشوائي اكثر لملئ فراغات جميع الحيز الذي تتواجد فيه. تقود العمليات التي تجري في المحلول غالباً الى زيادة في الانتروبي. فعندما تذوب بلورات السكر في الماء، يتكسر النظام الهيكلي المنتظم للسكر (المذاب) وكذلك جزء من الانتظام الهيكلي للماء (المذيب). وعليه يكون للمحلول لا انتظام اكثر مما للمذيب النقي والمذاب النقي معاً. وعند اذابة مادة صلبة ايونية مثل كلوريد الصوديوم NaCl ، فان الزيادة في الانتروبي تحصل نتيجة عاملين هما: أ - عملية تكوين المحلول (خلط المذاب مع المذيب) ب- تفكك المركب الصلب الى ايونات. يزيد التسخين ايضاً من انتروبي النظام، فالتسخين اضافة لزيادته الحركات الانتقالية للجزيئات يقوم بزيادة الحركات الدورانية والاهتزازية. اضافة لذلك، بزيادة درجة الحرارة، تزداد انواع الطاقات المرتبطة جميعها بالحركة الجزيئية. وعليه ان التسخين يزيد من عشوائية النظام لذا تزداد انتروبي النظام.","ln":[[209.6,51.4,552.8,67.4,0,65],[209.6,75.4,552.7,91.4,66,65],[446.8,99.4,552.8,115.4,132,22],[209.6,123.4,535.7,139.5,155,72],[209.6,147.4,552.8,163.4,228,62],[209.6,171.4,552.7,187.4,291,65],[209.6,195.4,552.8,211.5,357,70],[209.6,216.1,552.7,235.4,428,68],[429.0,243.4,552.8,259.4,497,22],[297.2,267.4,535.8,283.4,520,46],[349.3,291.4,552.8,307.4,567,32],[209.6,315.4,535.8,331.5,600,68],[209.6,339.4,552.8,355.4,669,68],[209.6,363.4,552.8,379.4,738,70],[212.6,387.4,552.8,403.4,809,75]],"l":"c1l20"},{"id":"bb918e4bbba","p":35,"k":"f <script type="application/json" id="seed-booklets">[{"schema":1,"kind":"booklet","id":"bkl.chem-6sci-2025.c1.sadiqak","version":1,"book":"chem-6sci-2025","book_sha256":"c8985b4456af1fa7b1188afdb0cc94d41708facdee76af15b93a2baff49e679c","subject":"chem-6sci","chapters":["c1"],"title":"ملزمة الفصل الأول: الثرموداينمك","author":"فريق صديقك","owner":"founder","status":"published","items":[{"id":"i44bdc8cf0","type":"key_idea","lesson":"c1l01","sort":10,"sources":[{"block":"b5019c62651","page":10,"start":46,"end":53,"quote":"لا يهتم"}],"title":"علم الثرموداينمك","body":"يدرس الطاقة وتحولاتها المصاحبة للتغيرات الفيزيائية والكيميائية، ويتنبأ بإمكانية حدوث التغير، لكنه لا يهتم بالزمن الذي يستغرقه."},{"id":"i72e40cfba","type":"key_idea","lesson":"c1l01","sort":20,"sources":[{"block":"b4c03f58559","page":10,"start":0,"end":19,"quote":"تشمل الطاقة الكامنة"}],"title":"الطاقة الكامنة والحركية","body":"الطاقة الكامنة تشمل الطاقة الكيميائية المخزونة في المواد والوقود، والطاقة الحركية تشمل طاقة الأجسام المتحركة."},{"id":"i80d15d49c","type":"law","lesson":"c1l02","sort":10,"sources":[{"block":"b7ef8b8dbfd","page":11,"start":0,"end":10,"quote":"1 J = 1 kg"}],"title":"الجول","body":"وحدة الطاقة في النظام الدولي هي الجول (J).","formula":"1 J = 1 kg·m²/s²"},{"id":"i1ea1936c9","type":"law","lesson":"c1l02","sort":20,"sources":[{"block":"b12b52fd954","page":11,"start":4,"end":7,"quote":"273"}],"title":"درجة الحرارة المطلقة","body":"تُستخدم في الثرموداينمك درجة الحرارة بالكلفن.","formula":"T(K) = t(°C) + 273"},{"id":"i3ddd8de84","type":"warning","lesson":"c1l02","sort":30,"sources":[{"block":"be30ff568c0","page":11,"start":0,"end":5,"quote":"انتبه"}],"body":"فرّق بين وحدة المتر (m) ورمز الكتلة (m)، وحوّل درجة الحرارة إلى الكلفن قبل التعويض."},{"id":"i74835e280","type":"definition","lesson":"c1l03","sort":10,"sources":[{"block":"b4eae28c148","page":11,"start":90,"end":116,"quote":"عبارة عن جزء معين من الكون"}],"title":"النظام","body":"جزء معيّن من الكون نهتم بدراسته، يتكون من المادة أو المواد المشتركة في التغير."},{"id":"i3fc77365c","type":"memorize","lesson":"c1l03","sort":20,"sources":[{"block":"ba6583c7f8c","page":11,"start":0,"end":26,"quote":"المجموعة = النظام + المحيط"}],"title":"المجموعة","body":"المحيط هو كل ما يحيط بالنظام خارج حدوده.","formula":"المجموعة = النظام + المحيط"},{"id":"i7f82f4052","type":"definition","lesson":"c1l03","sort":30,"sources":[{"block":"bb0f48abf65","page":12,"start":0,"end":18,"quote":"يكون النظام مفتوحا"}],"title":"النظام المفتوح","body":"تسمح حدوده بتبادل المادة والطاقة مع المحيط، مثل إناء معدني مكشوف فيه ماء مغلي."},{"id":"i030906f35","type":"definition","lesson":"c1l03","sort":40,"sources":[{"block":"bb13f72155e","page":12,"start":0,"end":17,"quote":"يكون النظام مغلقا"}],"title":"النظام المغلق","body":"تسمح حدوده بتبادل الطاقة فقط، ولا تتغير كمية مادته، مثل الإناء نفسه بعد إغلاقه بإحكام."},{"id":"i7e83fffd0","type":"definition","lesson":"c1l03","sort":50,"sources":[{"block":"bcd9fb6e665","page":12,"start":0,"end":19,"quote":"ويكون النظام معزولا"}],"title":"النظام المعزول","body":"لا تسمح حدوده بتبادل المادة ولا الطاقة مع المحيط، مثل الثرموس."},{"id":"i0215a2682","type":"warning","lesson":"c1l03","sort":60,"sources":[{"block":"bcd9fb6e665","page":12,"start":42,"end":71,"quote":"لا تسمح بتبادل المادة والطاقة"}],"body":"للتمييز بين الأنظمة الثلاثة انظر إلى ما تسمح به الحدود: مادة وطاقة (مفتوح)، طاقة فقط (مغلق)، لا شيء (معزول)."},{"id":"i1435b573a","type":"memorize","lesson":"c1l04","sort":10,"sources":[{"block":"befe68d26f8","page":13,"start":2,"end":8,"quote":"Tf -Ti"}],"title":"التغير في درجة الحرارة","body":"الحرارة (q) تنتقل بسبب فرق درجات الحرارة.","formula":"ΔT = Tf − Ti"},{"id":"ie3fdc7b1b","type":"definition","lesson":"c1l04","sort":20,"sources":[{"block":"bebd29fb9b3","page":13,"start":31,"end":51,"quote":"وتعرف السعة الحرارية"}],"title":"السعة الحرارية (C)","body":"كمية الحرارة اللازمة لرفع درجة حرارة كتلة m (بالغرام) من المادة درجة سيليزية واحدة."},{"id":"ie192766e7","type":"law","lesson":"c1l04","sort":30,"sources":[{"block":"b91aaf3b593","page":13,"start":1,"end":6,"quote":"q = C"}],"title":"علاقة الحرارة بالسعة الحرارية","body":"وحدة السعة الحرارية J/°C.","formula":"q = C × ΔT"},{"id":"i1e9f37574","type":"definition","lesson":"c1l04","sort":40,"sources":[{"block":"b2a2983c75c","page":13,"start":22,"end":47,"quote":"اما الحرارة النوعية فتعرف"}],"title":"الحرارة النوعية (c)","body":"كمية الحرارة اللازمة لرفع درجة حرارة غرام واحد من المادة درجة سيليزية واحدة، ووحدتها J/g·°C."},{"id":"i3c3363b06","type":"law","lesson":"c1l04","sort":50,"sources":[{"block":"bf1b6ae1ef6","page":13,"start":165,"end":171,"quote":"C̊ . ς"}],"title":"الحرارة النوعية والكتلة","body":"السعة الحرارية تساوي الحرارة النوعية مضروبة في الكتلة، لذلك q = m × c × ΔT.","formula":"C = c × m"},{"id":"i09186614c","type":"memorize","lesson":"c1l04","sort":60,"sources":[{"block":"bebd29fb9b3","page":13,"start":10,"end":14,"quote":"4.18"}],"body":"الحرارة النوعية للماء السائل 4.18 J/g·°C، وهي من أعلى القيم في الجدول."},{"id":"ia3886cb58","type":"law","lesson":"c1l05","sort":10,"sources":[{"block":"b73e29de400","page":14,"start":0,"end":40,"quote":"حيث qP تمثل الحرارة المقاسة عند ضغط ثابت"}],"title":"التغير في الانثالبي","body":"ΔH هي الحرارة المقاسة عند ضغط ثابت، لأن أغلب التفاعلات تجري عند ضغط ثابت.","formula":"ΔH = qP"},{"id":"i32c15b55e","type":"key_idea","lesson":"c1l05","sort":20,"sources":[{"block":"b414829ee5b","page":15,"start":15,"end":26,"quote":"اصغر من صفر"}],"title":"إشارة ΔH","body":"إذا كانت ΔH سالبة فالتفاعل باعث للحرارة، وإذا كانت موجبة فالتفاعل ماص للحرارة."},{"id":"i91dd658fe","type":"memorize","lesson":"c1l05","sort":30,"sources":[{"block":"b31446143b8","page":15,"start":9,"end":19,"quote":"Exothermic"}],"body":"الباعث للحرارة: ΔH < 0 (Exothermic)، الماص للحرارة: ΔH > 0 (Endothermic)."},{"id":"if6eddc892","type":"definition","lesson":"c1l06","sort":10,"sources":[{"block":"b9e0175926a","page":15,"start":0,"end":24,"quote":"هي تلك الخاصية او الكمية"}],"title":"دالة الحالة","body":"خاصية أو كمية تعتمد على الحالة الابتدائية والحالة النهائية للنظام فقط، ولا تعتمد على الطريق الذي يسلكه التغير."},{"id":"i6f53daf9b","type":"warning","lesson":"c1l06","sort":20,"sources":[{"block":"b5bc850ec6b","page":15,"start":105,"end":131,"quote":"لايمكن قياس القيمة المطلقة"}],"body":"لا يمكن قياس القيمة المطلقة لدوال الحالة، وإنما يُقاس التغير فيها فقط."},{"id":"i67d95cb9c","type":"definition","lesson":"c1l07","sort":10,"sources":[{"block":"b7ac7d88e23","page":16,"start":0,"end":33,"quote":"الخواص التي تعتمد على كمية المادة"}],"title":"الخواص الشاملة (Extensive)","body":"تعتمد على كمية المادة: الكتلة، الحجم، السعة الحرارية، الانثالبي، الانتروبي، الطاقة الحرة."},{"id":"i52ab1c9fb","type":"definition","lesson":"c1l07","sort":20,"sources":[{"block":"b17377327ea","page":16,"start":0,"end":35,"quote":"الخواص التي لاتعتمد على كمية المادة"}],"title":"الخواص المركزة (Intensive)","body":"لا تعتمد على كمية المادة: الضغط، درجة الحرارة، الكثافة، الحرارة النوعية."},{"id":"ieedce6913","type":"memorize","lesson":"c1l07","sort":30,"sources":[{"block":"b17377327ea","page":16,"start":132,"end":151,"quote":"الانثالبي دالة حالة"}],"body":"الانثالبي دالة حالة، وهي خاصية شاملة."},{"id":"ia1cc70837","type":"definition","lesson":"c1l08","sort":10,"sources":[{"block":"b77b1fe5844","page":16,"start":0,"end":31,"quote":"علم يهتم بدراسة الحرارة الممتصة"}],"title":"الكيمياء الحرارية","body":"علم يهتم بدراسة الحرارة الممتصة والمنبعثة (المتحررة) نتيجة التغيرات الفيزيائية والكيميائية."},{"id":"i4f4402554","type":"key_idea","lesson":"c1l09","sort":10,"sources":[{"block":"bc2af191404","page":17,"start":112,"end":129,"quote":"بجهاز يسمى المسعر"}],"title":"المسعر","body":"تُقاس حرارة التفاعل الممتصة أو المتحررة بجهاز يسمى المسعر (Calorimeter)."},{"id":"i0380c64eb","type":"example","lesson":"c1l09","sort":20,"sources":[{"block":"b74c5750c47","page":18,"start":5,"end":10,"quote":"22680"}],"title":"مثال المسعر","body":"ارتفعت حرارة 1200 g من الماء من 21.0 إلى 25.5 °C، فإن ΔT = 4.5 °C والحرارة المتحررة 22680 J.","formula":"q = 4.2 × 1200 × 4.5 = 22680 J"},{"id":"ia8f50379f","type":"key_idea","lesson":"c1l10","sort":10,"sources":[{"block":"b828863bf87","page":19,"start":19,"end":27,"quote":"6 kJ/mol"}],"title":"المعادلة الكيميائية الحرارية","body":"معادلة موزونة تُذكر فيها الحالة الفيزيائية لكل مادة وقيمة ΔH بإشارتها.","formula":"H2O(s) → H2O(l)   ΔH = +6 kJ/mol"},{"id":"i7e8c3243b","type":"example","lesson":"c1l10","sort":20,"sources":[{"block":"bb718ff8fed","page":20,"start":40,"end":50,"quote":"890 kJ/mol"}],"title":"احتراق الميثان","body":"تفاعل باعث للحرارة.","formula":"CH4(g) + 2O2(g) → CO2(g) + 2H2O(l)   ΔH = −890 kJ/mol"},{"id":"i3df264a00","type":"warning","lesson":"c1l10","sort":30,"sources":[{"block":"b9156da01bc","page":21,"start":27,"end":37,"quote":"242 kJ/mol"}],"body":"الحالة الفيزيائية تغيّر قيمة ΔH: تكوين الماء السائل −286 kJ/mol، وبخار الماء −242 kJ/mol."},{"id":"i83d472d7f","type":"definition","lesson":"c1l11","sort":10,"sources":[{"block":"b91832aa001","page":21,"start":30,"end":66,"quote":"عند الظروف القياسية المحيطة بالتفاعل"}],"title":"الانثالبي القياسية (ΔH°r)","body":"قيمة الانثالبي المقاسة عند الظروف القياسية: 25 °C (298 K) وضغط 1 atm."},{"id":"i2b3d63a04","type":"definition","lesson":"c1l13","sort":10,"sources":[{"block":"be95cdc821d","page":22,"start":72,"end":133,"quote":"وتعرف بانها الحرارة اللازمة (ممتصة او منبعثة) لتكوين مول واحد"}],"title":"انثالبي التكوين القياسية (ΔH°f)","body":"الحرارة اللازمة (ممتصة أو منبعثة) لتكوين مول واحد من أي مركب من عناصره الأساسية بأثبت صورها في الظروف القياسية."},{"id":"i5b56af69c","type":"memorize","lesson":"c1l13","sort":20,"sources":[{"block":"baa48f1acec","page":22,"start":11,"end":19,"quote":"0 kJ/mol"}],"body":"انثالبي التكوين القياسية لأي عنصر في أثبت صوره = صفر، مثل O2(g) وC(graphite).","formula":"ΔH°f(Element) = 0 kJ/mol"},{"id":"i2a67a9b12","type":"warning","lesson":"c1l13","sort":30,"sources":[{"block":"bf6798b0de9","page":22,"start":11,"end":39,"quote":"هو اثبت صورة من كاربون الماس"}],"body":"الكرافيت أثبت صورة للكاربون من الماس، لذلك ΔH°f للكرافيت = صفر وليس للماس."},{"id":"if33c60115","type":"example","lesson":"c1l13","sort":40,"sources":[{"block":"be91d0e518a","page":23,"start":10,"end":20,"quote":"286 kJ/mol"}],"title":"تكوين الماء السائل","formula":"H2(g) + ½O2(g) → H2O(l)   ΔH°f = −286 kJ/mol"},{"id":"ic7f5bb71f","type":"definition","lesson":"c1l14","sort":10,"sources":[{"block":"b572d04bf8f","page":25,"start":62,"end":93,"quote":"يرمز لانثالبي الاحتراق القياسية"}],"title":"انثالبي الاحتراق القياسية (ΔH°c)","body":"الحرارة المصاحبة لحرق مول واحد من أي مادة حرقًا تامًا مع الأوكسجين عند الظروف القياسية (25 °C وضغط 1 atm)."},{"id":"icff16e977","type":"memorize","lesson":"c1l14","sort":20,"sources":[{"block":"bdc1e481737","page":25,"start":0,"end":40,"quote":"286 kJ/mol - = ̊H2(g) + O2(g) H2O(l) ∆Hc"}],"body":"انثالبي احتراق الهيدروجين يساوي انثالبي تكوين الماء السائل: −286 kJ/mol."},{"id":"i7470acd35","type":"example","lesson":"c1l14","sort":30,"sources":[{"block":"bf3f7747684","page":25,"start":39,"end":50,"quote":"2873 kJ/mol"}],"title":"احتراق البيوتان","formula":"C4H10(g) + 13/2 O2(g) → 4CO2(g) + 5H2O(l)   ΔH°c = −2873 kJ/mol"},{"id":"i0581b7245","type":"definition","lesson":"c1l15","sort":10,"sources":[{"block":"b15ea0662d6","page":26,"start":114,"end":138,"quote":"تســـــــمى عملية التبخر"}],"title":"التبخر","body":"تحول المادة من الحالة السائلة إلى الحالة الغازية، ويرمز لحرارته ΔHvap (للماء 44 kJ/mol)."},{"id":"i709f9ec8a","type":"definition","lesson":"c1l15","sort":20,"sources":[{"block":"badf39d83b7","page":26,"start":91,"end":111,"quote":"وتسمى عملية الانصهار"}],"title":"الانصهار","body":"انتقال المادة من الطور الصلب إلى الطور السائل، ويرمز لحرارته ΔHfus (للماء 6 kJ/mol)."},{"id":"i4ff708839","type":"memorize","lesson":"c1l15","sort":30,"sources":[{"block":"bb245f48977","page":26,"start":26,"end":46,"quote":"∆Hcond = - 44 kJ/mol"}],"body":"حرارة التكثيف تساوي حرارة التبخر بإشارة معاكسة.","formula":"ΔHcond = −ΔHvap = −44 kJ/mol"},{"id":"i0cfcd05c2","type":"law","lesson":"c1l17","sort":10,"sources":[{"block":"b91db9af501","page":27,"start":80,"end":201,"quote":"عند تحويل المتفاعلات الى نواتج فان التغير في انثالبي التفاعل هو نفسه سواء تم التفاعل في خطوة واحدة او في سلسلة من الخطوات"}],"title":"قانون هيس","body":"ΔH للتفاعل الكلي واحدة مهما كان عدد الخطوات، لأن الانثالبي دالة حالة.","cite":"عند تحويل المتفاعلات الى نواتج فان التغير في انثالبي التفاعل هو نفسه سواء تم التفاعل في خطوة واحدة او في سلسلة من الخطوات"},{"id":"iea08e3986","type":"key_idea","lesson":"c1l17","sort":20,"sources":[{"block":"b1212c28831","page":28,"start":14,"end":39,"quote":"اذا استطعنا تجزئة التفاعل"}],"title":"متى نستخدم قانون هيس","body":"لحساب ΔH°r لتفاعلات لا يمكن قياسها مباشرة: نجزئ التفاعل إلى تفاعلات معلومة ΔH° ثم نجمعها."},{"id":"i87d0e71f0","type":"warning","lesson":"c1l17","sort":30,"sources":[{"block":"b88fce0e2e5","page":29,"start":68,"end":87,"quote":"يجب عكس المعادلة (3"}],"title":"عكس المعادلة","body":"عند عكس المعادلة تنعكس إشارة ΔH."},{"id":"i9c68053df","type":"warning","lesson":"c1l17","sort":40,"sources":[{"block":"bb1628a1547","page":29,"start":13,"end":42,"quote":"يجب ضرب المعادلة (2) بالعدد 2"}],"title":"ضرب المعادلة","body":"عند ضرب المعادلة بعدد يُضرب ΔH بالعدد نفسه."},{"id":"i5dfbd1ca6","type":"example","lesson":"c1l17","sort":50,"sources":[{"block":"bebc0f756b2","page":28,"start":0,"end":12,"quote":"393.5 kJ/mol"}],"title":"احتراق الكرافيت","formula":"C(graphite) + O2(g) → CO2(g)   ΔH°r = −393.5 kJ/mol"},{"id":"ic94d6dc86","type":"law","lesson":"c1l18","sort":10,"sources":[{"block":"b4f3d4a371e","page":30,"start":0,"end":22,"quote":"حيث n تمثل عدد المولات"}],"title":"حساب ΔH°r من انثالبيات التكوين","body":"حيث n عدد المولات، و∑ تعني المجموع.","formula":"ΔH°r = Σ n ΔH°f(Products) − Σ n ΔH°f(Reactants)"},{"id":"ief69fab67","type":"warning","lesson":"c1l18","sort":20,"sources":[{"block":"b4f3d4a371e","page":30,"start":4,"end":22,"quote":"n تمثل عدد المولات"}],"body":"اضرب ΔH°f لكل مادة بعدد مولاتها في المعادلة الموزونة، وتذكّر أن ΔH°f للعنصر بأثبت صوره صفر."},{"id":"ic7ac95e3a","type":"definition","lesson":"c1l19","sort":10,"sources":[{"block":"b9aec4b24b8","page":32,"start":14,"end":42,"quote":"تعرف العملية التلقائية بانها"}],"title":"العملية التلقائية","body":"أي عملية فيزيائية أو كيميائية يمكن أن تحدث من تلقاء نفسها عند ظروف معينة دون تأثير أي عامل خارجي."},{"id":"ibae51b4e4","type":"example","lesson":"c1l19","sort":20,"sources":[{"block":"b229e9f87c5","page":32,"start":2,"end":48,"quote":"انتقال الحرارة من الجسم الحار الى الجسم البارد"}],"title":"أمثلة تلقائية","body":"انتقال الحرارة من الجسم الحار إلى البارد، وذوبان السكر في القهوة. العكس لا يحدث تلقائيًا."},{"id":"i2c7399868","type":"warning","lesson":"c1l19","sort":30,"sources":[{"block":"becff69dafb","page":33,"start":11,"end":18,"quote":"NH4Cl(s"}],"body":"ليست كل العمليات التلقائية باعثة للحرارة: ذوبان NH4Cl في الماء تلقائي مع أنه ماص للحرارة (ΔH = +14 kJ)."},{"id":"i808a58c11","type":"definition","lesson":"c1l20","sort":10,"sources":[{"block":"b06d4ac31ea","page":34,"start":108,"end":140,"quote":"والتي تعرف بانها مقياس للعشوائية"}],"title":"الانتروبي (S)","body":"مقياس للعشوائية أو اللاانتظام في النظام."},{"id":"i912fab3c0","type":"memorize","lesson":"c1l20","sort":20,"sources":[{"block":"b455bfa6f1b","page":34,"start":4,"end":11,"quote":"Sf - Si"}],"title":"التغير في الانتروبي","formula":"ΔS = Sf − Si"},{"id":"i1dd23ce69","type":"memorize","lesson":"c1l20","sort":30,"sources":[{"block":"bc39d3a0490","page":35,"start":10,"end":49,"quote":"انتروبي الغازات اكبر من انتروبي السوائل"}],"title":"ترتيب الانتروبي","body":"انتروبي الغازات أكبر من انتروبي السوائل، وهذه أكبر من انتروبي المواد الصلبة."},{"id":"i07e7fb1dd","type":"law","lesson":"c1l20","sort":40,"sources":[{"block":"bb8d0c92d69","page":37,"start":1,"end":16,"quote":"Reactants)̊ n S"}],"title":"الانتروبي القياسية للتفاعل","formula":"ΔS°r = Σ n S°(Products) − Σ n S°(Reactants)"},{"id":"i66a4826c0","type":"law","lesson":"c1l21","sort":10,"sources":[{"block":"b5ecc7 <script>
'use strict';
function diag() {}
'use strict';
/* kv.js — local-first key/value store shared by the reader and the dashboard (IndexedDB → localStorage → memory). */
const KV = (() => {
  let mode = 'mem', db = null, warned = false;
  const mem = new Map();
  const ready = (async () => {
    try {
      if (!window.indexedDB) throw new Error('no idb');
      db = await new Promise((res, rej) => {
        const r = indexedDB.open('sadiqak', 1);
        r.onupgradeneeded = () => { if (!r.result.objectStoreNames.contains('kv')) r.result.createObjectStore('kv'); };
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error || new Error('idb'));
        r.onblocked = () => rej(new Error('idb blocked'));
      });
      mode = 'idb';
      return;
    } catch (e) { /* fall through */ }
    try { localStorage.setItem('sq:probe', '1'); localStorage.removeItem('sq:probe'); mode = 'ls'; } catch (e) { mode = 'mem'; }
  })();
  const run = (kind, fn) => new Promise((res, rej) => {
    const t = db.transaction('kv', kind);
    const req = fn(t.objectStore('kv'));
    t.oncomplete = () => res(req ? req.result : undefined);
    t.onerror = () => rej(t.error || new Error('tx'));
    t.onabort = () => rej(t.error || new Error('abort'));
  });
  const fail = () => { if (!warned) { warned = true; if (typeof toast === 'function') toast('تعذّر حفظ ملاحظاتك على هذا الجهاز'); } };
  return {
    ready, mode: () => mode,
    async get(k) {
      await ready;
      try {
        if (mode === 'idb') return await run('readonly', s => s.get(k));
        if (mode === 'ls') { const v = localStorage.getItem('sq:' + k); return v == null ? undefined : JSON.parse(v); }
      } catch (e) { /* use memory */ }
      return mem.get(k);
    },
    async set(k, v) {
      await ready;
      try {
        if (mode === 'idb') { await run('readwrite', s => s.put(v, k)); return; }
        if (mode === 'ls') { localStorage.setItem('sq:' + k, JSON.stringify(v)); return; }
      } catch (e) { fail(); }
      mem.set(k, v);
    },
    async del(k) {
      await ready;
      try {
        if (mode === 'idb') { await run('readwrite', s => s.delete(k)); return; }
        if (mode === 'ls') { localStorage.removeItem('sq:' + k); return; }
      } catch (e) { fail(); }
      mem.delete(k);
    },
  };
})();

/* ================= content store: the curriculum as local-first, versioned, admin-editable data ================= */
const Content = (() => {
  const KINDS = ['chapters', 'lessons', 'topics', 'blocks', 'summaries', 'questions', 'videos', 'news', 'booklets'];
  const REQUIRED = {
    chapters: ['id', 'n', 'title', 'from', 'to'], lessons: ['id', 'chapter', 'title', 'page'], topics: ['id', 'chapter', 'name'],
    blocks: ['id', 'p', 'k', 'b', 'x', 'l'], summaries: ['id', 'lesson'], questions: ['id', 'chapter'],
    videos: ['id', 'provider', 'ref'], news: ['id', 'title', 'source', 'date'], booklets: ['id', 'title'],
  };
  const OWN_TITLES = /^(افتتاحية الفصل|أسئلة الفصل)$/;          // the index draws these two itself
  const ix = { ready: false };
  let pack = null, saveT = 0;
  const key = id => 'content:' + id;
  const live = r => r && !r.deleted;
  const push = (m, k, v) => { const a = m.get(k); if (a) a.push(v); else m.set(k, [v]); };
  const packErr = (m, name) => Object.assign(new Error(m), { name: name || 'PackError' });

  function validate(p) {
    if (!p || typeof p !== 'object') throw packErr('pack is not an object');
    if (p.kind !== 'content-pack') throw packErr('kind must be "content-pack"');
    if (!p.book || !p.book.id) throw packErr('book.id is missing');
    if (!Number.isInteger(p.version) || p.version < 1) throw packErr('version must be a positive integer');
    for (const k of KINDS) {
      if (p[k] === undefined) continue;
      if (!Array.isArray(p[k])) throw packErr(k + ' must be an array');
      const seen = new Set();
      for (const r of p[k]) {
        for (const f of REQUIRED[k]) if (r[f] === undefined || r[f] === null || r[f] === '') throw packErr(k + '/' + (r.id || '?') + ': missing ' + f);
        if (seen.has(r.id)) throw packErr(k + ': duplicate id ' + r.id);
        seen.add(r.id);
      }
    }
    const ids = k => new Set((p[k] || []).map(r => r.id));
    const ch = ids('chapters'), le = ids('lessons'), to = ids('topics');
    for (const l of p.lessons || []) {
      if (!ch.has(l.chapter)) throw packErr('lesson ' + l.id + ': unknown chapter ' + l.chapter);
      if (l.topic && !to.has(l.topic)) throw packErr('lesson ' + l.id + ': unknown topic ' + l.topic);
    }
    for (const t of p.topics || []) if (!ch.has(t.chapter)) throw packErr('topic ' + t.id + ': unknown chapter ' + t.chapter);
    for (const b of p.blocks || []) if (!le.has(b.l)) throw packErr('block ' + b.id + ': unknown lesson ' + b.l);
    return true;
  }
  function normalize(p) { for (const k of KINDS) if (!Array.isArray(p[k])) p[k] = []; return p; }

  function build() {
    for (const k of KINDS) ix[k] = new Map(pack[k].filter(live).map(r => [r.id, r]));
    ix.lessonsByChapter = new Map(); ix.blocksByPage = new Map(); ix.blocksByLesson = new Map();
    for (const l of ix.lessons.values()) push(ix.lessonsByChapter, l.chapter, l);
    for (const a of ix.lessonsByChapter.values()) a.sort((x, y) => x.page - y.page || (x.top || 0) - (y.top || 0));
    for (const b of ix.blocks.values()) { push(ix.blocksByPage, b.p, b); push(ix.blocksByLesson, b.l, b); }
    for (const a of ix.blocksByPage.values()) a.sort((x, y) => x.b[1] - y.b[1] || y.b[2] - x.b[2]);
    ix.stamp = (ix.stamp || 0) + 1;
    ix.ready = true;
  }

  async function init(seed) {
    if (!seed) throw packErr('no seed pack in this build');
    validate(seed);
    let stored = null, chosen = seed, why = 'seed';
    try { stored = await KV.get(key(seed.book.id)); } catch (e) { stored = null; }
    if (stored) {
      try { validate(stored); if (stored.version >= seed.version) { chosen = stored; why = 'installed'; } }
      catch (e) { diag('content: installed pack rejected (' + e.message + '), reinstalling the seed'); }
    }
    pack = normalize(chosen);
    if (chosen === seed) await KV.set(key(seed.book.id), pack);
    build();
    diag('content: ' + why + ' pack v' + pack.version + ' (' + ix.chapters.size + ' chapters, ' + ix.lessons.size + ' lessons, ' + ix.topics.size + ' topics, ' + ix.blocks.size + ' blocks)');
    return pack;
  }

  /* ---- reading ---- */
  const chapters = () => [...ix.chapters.values()].sort((a, b) => a.n - b.n);
  function chapterAt(page) { for (const c of ix.chapters.values()) if (page >= c.from && page <= c.to) return c; return null; }
  function lessonsOf(chId) {
    const own = ix.lessonsByChapter.get(chId);
    if (own) return own;
    const c = ix.chapters.get(chId);
    return c && Array.isArray(c.lessons) ? c.lessons.map(l => Object.assign({ chapter: chId, top: 0 }, l)) : [];
  }
  function lessonAt(page, y) {
    const c = chapterAt(page); if (!c) return null;
    let best = null;
    for (const l of lessonsOf(c.id)) { if (l.page < page || (l.page === page && (l.top || 0) <= y)) best = l; else break; }
    return best;
  }
  const blocksOn = page => ix.blocksByPage.get(page) || [];
  const blocksOf = lessonId => ix.blocksByLesson.get(lessonId) || [];
  const get = (kind, id) => (ix[kind] && ix[kind].get(id)) || null;
  const all = kind => (ix[kind] ? [...ix[kind].values()] : []);
  function readerChapters() {
    return chapters().map(c => ({ n: c.n, id: c.id, name: c.name, title: c.title, from: c.from, to: c.to, q: c.q,
      lessons: lessonsOf(c.id).filter(l => !OWN_TITLES.test(l.title)).map(l => [l.title, l.page]) }));
  }

  /* ---- editing (the admin dashboard will call exactly these) ---- */
  function persist() { clearTimeout(saveT); saveT = setTimeout(() => { KV.set(key(pack.book.id), pack); }, 300); }
  async function flush() { clearTimeout(saveT); await KV.set(key(pack.book.id), pack); }
  function upsert(kind, rec) {
    if (KINDS.indexOf(kind) < 0) throw packErr('unknown kind ' + kind);
    if (!rec || !rec.id) throw packErr(kind + ': record needs an id');
    const list = pack[kind], i = list.findIndex(r => r.id === rec.id), prev = i >= 0 ? list[i] : null;
    const next = Object.assign({}, rec, { rev: ((prev && prev.rev) || 0) + 1, updated: Date.now() });
    delete next.deleted;
    const trial = Object.assign({}, pack, { [kind]: i >= 0 ? list.map((r, j) => (j === i ? next : r)) : list.concat([next]) });
    validate(trial);                                           // refuse edits that break a reference
    pack[kind] = trial[kind]; pack.dirty = true;
    build(); persist();
    return next;
  }
  function remove(kind, id) {
    const list = pack[kind] || [], i = list.findIndex(r => r.id === id);
    if (i < 0 || list[i].deleted) return false;
    const busy = kind === 'chapters' ? all('lessons').some(l => l.chapter === id)
      : kind === 'lessons' ? blocksOf(id).length > 0
      : kind === 'topics' ? all('lessons').some(l => l.topic === id) : false;
    if (busy) throw packErr(kind + '/' + id + ' still has content attached', 'PackInUse');
    list[i] = Object.assign({}, list[i], { deleted: true, rev: (list[i].rev || 0) + 1, updated: Date.now() });
    pack.dirty = true;
    build(); persist();
    return true;
  }
  async function publish() { pack.version += 1; pack.published = new Date().toISOString(); pack.dirty = false; await flush(); return pack.version; }
  const exportPack = () => JSON.stringify(pack);
  async function importPack(obj, force) {
    const p = typeof obj === 'string' ? JSON.parse(obj) : obj;
    validate(p);
    if (pack && p.book.id === pack.book.id && p.version < pack.version && !force) throw packErr('pack v' + p.version + ' is older than installed v' + pack.version, 'PackVersion');
    pack = normalize(p); build(); await flush();
    return pack.version;
  }

  return { init, validate, chapters, chapterAt, lessonsOf, lessonAt, blocksOn, blocksOf, get, all, readerChapters,
    upsert, remove, publish, exportPack, importPack, flush, ix, get pack() { return pack; }, KINDS };
})();

/* ================= booklets (ملازم): independent content that points into the book ================= */
const Booklets = (() => {
  let remote = null;
  const TYPES = { definition: 'تعريف', law: 'قانون', key_idea: 'فكرة أساسية', warning: 'تنبيه', memorize: 'مهم للحفظ', example: 'مثال', summary: 'ملخص' };
  const EDIT_ROLES = new Set(['founder', 'admin']);
  const map = new Map();
  let role = 'student', stamp = 0, normCache = new Map(), normStamp = -1;
  const key = id => 'booklet:' + id;
  const err = (m, name) => Object.assign(new Error(m), { name: name || 'BookletError' });
  const live = b => b.items.filter(i => !i.deleted);

  /* ---- anchoring: block id + char range, re-found by the quoted words if the book was re-extracted ---- */
  function normOf(b) {
    if (normStamp !== Content.ix.stamp) { normCache = new Map(); normStamp = Content.ix.stamp; }
    let v = normCache.get(b.id);
    if (!v) { v = Search.normMap(b.x); normCache.set(b.id, v); }
    return v;
  }
  function locate(b, quote) {
    const q = Search.norm(quote); if (!q) return null;
    const nm = normOf(b), i = nm.n.indexOf(q);
    return i < 0 ? null : [nm.map[i], nm.map[i + q.length - 1] + 1];
  }
  function resolve(src) {
    if (!src) return null;
    const b = src.block ? Content.get('blocks', src.block) : null;
    if (b) {
      const s = src.start, e = src.end;
      if (Number.isInteger(s) && Number.isInteger(e) && s >= 0 && e <= b.x.length && s < e && (!src.quote || b.x.slice(s, e) === src.quote)) return { block: b, range: [s, e], exact: true };
      if (src.quote) { const r = locate(b, src.quote); if (r) return { block: b, range: r, exact: false }; }
      else return { block: b, range: [0, b.x.length], exact: false };
    }
    if (src.quote && Search.norm(src.quote).length >= 8) {
      for (const c of Content.all('blocks')) { const r = locate(c, src.quote); if (r) return { block: c, range: r, reanchored: true }; }
    }
    return null;
  }

    if (!Number.isInteger(b.version) || b.version < 1) throw err('version must be a positive integer');

      seen.add(it.id);
      if (it.deleted) continue;

      if (!(it.body || it.formula || it.cite)) throw err('item ' + it.id + ': needs a body, formula or cite');
      if (it.lesson != null && !Content.get('lessons', it.lesson)) throw err('item ' + it.id + ': unknown lesson ' + it.lesson);

  async function init(seeds) {

  const get = id => { const b = map.get(id); return b && !b.deleted ? b : null; };
  const forBook = (bookId, chapterId) => [...map.values()].filter(b => !b.deleted && b.book === bookId && (!chapterId || !b.chapters || !b.chapters.length || b.chapters.indexOf(chapterId) >= 0));
  function sections(b) {

    for (const it of live(b)) { const k = it.lesson || ''; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(it); }

  /* ---- editing: founder / admin only (the dashboard calls exactly these) ---- */
  function assertRole() { if (!EDIT_ROLES.has(role) || !Perm.can('booklets:write')) throw err('editing a booklet needs the booklets:write permission (current: ' + Perm.role + ')', 'PermissionError'); }

  async function upsertItem(id, item) {

  async function removeItem(id, itemId) {

  }
  async function create(meta) {
    assertRole();

  async function removeBooklet(id) { assertRole(); const b = map.get(id); if (!b) return false; await save(Object.assign({}, b, { deleted: true, updated: Date.now() })); return true; }

  async function applyRelease(obj) {

  }
  // title, author, origin, file… — everything but the items and the version history
  async function updateMeta(id, fields) {
    assertRole();
    const b = map.get(id); if (!b) throw err('no booklet ' + id);
    const next = Object.assign({}, b, fields, { id: b.id, kind: 'booklet', items: b.items, version: b.version, updated: Date.now() });
    validate(next); return save(next);
  }
  async function publish(id) {
    assertRole();
    const b = map.get(id); if (!b) throw err('no booklet ' + id);

  return { TYPES, init, get, forBook, sections, resolve, linesOf, validate, upsertItem, removeItem, create, removeBooklet, publish, importBooklet,
    exportBooklet: id => JSON.stringify(map.get(id)), all: () => [...map.values()].filter(b => !b.deleted), live,
    applyRelease, updateMeta,
    setRemote(fn) { remote = fn; }, load(list) { map.clear(); for (const b of list || []) map.set(b.id, b); stamp++; },
    setRole(r) { role = String(r || 'student'); Perm.setUser({ id: 'local', role, grants: role === 'admin' ? Perm.ACTIONS.filter(a => a !== 'roles:manage') : [] }); }, get role() { return role; }, get stamp() { return stamp; } };
})();


'use strict';
/* perm.js — one permission matrix for the whole app.
   Every write in every service goes through Perm.assert(). The same matrix is mirrored as
   row-level-security policies in schema-v4.sql; test_perm.py fails if the two drift apart.
   In this offline prototype the check runs in the service layer; on the server the database
   enforces the same rules, so a direct API call without the right role is refused there too. */
const Perm = (() => {
  const ACTIONS = [
    'books:write', 'books:publish',
    'booklets:write', 'booklets:publish',
    'questions:write', 'questions:approve',
    'exams:write', 'exams:publish',
    'videos:write', 'news:write',
    'content:release', 'roles:manage'
  ];
  const STUDENT = ['content:read', 'exam:take'];
  let user = { id: 'local', role: 'student', grants: [] };
  const err = (m) => { const e = new Error(m); e.name = 'PermissionError'; return e; };

  function can(action, u) {
    u = u || user;
    if (STUDENT.includes(action)) return true;              // everyone signed in can read and take exams
    if (u.role === 'founder') return ACTIONS.includes(action);
    if (u.role === 'admin') return ACTIONS.includes(action) && action !== 'roles:manage' && (u.grants || []).includes(action);
    return false;
  }
  function assert(action) {
    if (!can(action)) throw err('هذا الإجراء (' + action + ') يحتاج صلاحية ' + (action === 'roles:manage' ? 'المؤسس' : 'المؤسس أو مشرف مُنح هذه الصلاحية') + ' — الحالية: ' + user.role);
  }
  function setUser(u) {
    const role = ['founder', 'admin', 'student'].includes(u && u.role) ? u.role : 'student';
    user = { id: (u && u.id) || 'local', role, grants: role === 'admin' ? ((u && u.grants) || []).filter(a => ACTIONS.includes(a)) : [] };
    return user;
  }
  // only the founder hands out admin powers, and never the power to hand out powers
  function grant(target, actions) {
    assert('roles:manage');
    const g = (actions || []).filter(a => ACTIONS.includes(a) && a !== 'roles:manage');
    return { id: target.id, role: 'admin', grants: g };
  }
  function matrix() {
    const out = {};
    for (const role of ['founder', 'admin', 'student']) {
      out[role] = {};
      for (const a of ACTIONS.concat(STUDENT)) out[role][a] = can(a, { role, grants: role === 'admin' ? ACTIONS.filter(x => x !== 'roles:manage') : [] });
    }
    return out;
  }
  return { ACTIONS, STUDENT, can, assert, setUser, grant, matrix, get user() { return user; }, get role() { return user.role; } };
})();

'use strict';
/* bank.js — question bank + exam engine.

   Question type and answer kind are data on each item — the UI renders whatever the item says. */

  let bank = null, stamp = 0, remote = null;
  const byId = new Map(), byQ = new Map(), byTopic = new Map(), byChapter = new Map(), byExam = new Map();
  const err = (m, n) => { const e = new Error(m); e.name = n || 'BankError'; return e; };
  const SOURCES = ['ministry', 'monthly', 'practice', 'generated'];
  const KINDS = ['numeric', 'choice', 'multi', 'bool', 'exact', 'essay'];
  const STATUS = ['draft', 'review', 'approved', 'rejected', 'hidden'];

  const AR = { '٠': '0', '١': '1', '٢': '2', '٣': '3', '٤': '4', '٥': '5', '٦': '6', '٧': '7', '٨': '8', '٩': '9', '٫': '.', '،': ',' };

  }

    s = s.replace(/\s+/g, '').replace(/,/g, '');
    const sup = s.match(/^([-+]?[\d.]+)?[×x*]?10(?:\^)?([-+]?\d+)$/);
    if (sup) return (sup[1] ? parseFloat(sup[1]) : 1) * Math.pow(10, parseInt(sup[2], 10));
    const m = s.match(/^[-+]?[\d.]+(?:[eE][-+]?\d+)?/);

  const statusOf = it => it.status || 'approved';

  const visible = it => !!it && !it.deleted && statusOf(it) === 'approved' && !!it.ready;

  function index() {
    [byId, byQ, byTopic, byChapter, byExam].forEach(m => m.clear());
    if (!bank) return;
    bank.sets = bank.sets || [];
    for (const q of bank.questions) byQ.set(q.id, q);
    for (const it of bank.items) {
      if (it.deleted) continue;
      byId.set(it.id, it);
      const push = (m, k) => { if (!k) return; if (!m.has(k)) m.set(k, []); m.get(k).push(it.id); };
      push(byTopic, it.topic); push(byChapter, it.chapter); push(byExam, it.exam);
    }

  }
  async function init(seed) {
    const saved = await KV.get('bank:current');
    bank = (saved && saved.items && (!seed || (saved.version || 1) >= (seed.version || 1))) ? saved : (seed || null);
    if (bank && bank !== saved) await KV.set('bank:current', bank);

  /* ---------- display: the printed question, never rebuilt ---------- */
  function sourceLabel(it) {
    const k = srcKind(it);

      if (ex) return 'وزاري ' + ex.year + ' — ' + ex.session;

    if (k === 'monthly') return 'شهري' + (it.prov && it.prov.source_name ? ' — ' + it.prov.source_name : '');
    if (k === 'practice') return 'تدريبي';

  function present(itemId) {
    const it = byId.get(itemId); if (!it) throw err('no such question: ' + itemId);
    const q = it.q ? byQ.get(it.q) : null, ex = (bank.exams || []).find(e => e.id === it.exam) || null;
    const stem = [];

      kind: (it.answer || {}).kind || null, options: (it.answer || {}).options || null,

    if (f.type) out = out.filter(i => i.type === f.type);
    if (f.kind) out = out.filter(i => (i.answer || {}).kind === f.kind);

    if (f.status) out = out.filter(i => statusOf(i) === f.status);

  /* ---------- grading: every method is testable, none is a guess ---------- */

    const it = byId.get(itemId); if (!it) throw err('no such question: ' + itemId);
    const a = it.answer;
    if (!a) return { kind: 'none', correct: null, why: 'هذا السؤال بانتظار اعتماد إجابته' };
    if (a.kind === 'numeric') {

    }

  function evalExpr(expr) {

    let i = 0;

      if (m) {

    }

    function power() {                          // right-associative: 2**3**2 = 2**9

      if (eat('^')) return Math.pow(base, unary());

    if (!it.topic) bad.push('لا يوجد موضوع');
    if (pack && it.topic) {
      const t = (pack.topics || []).find(x => x.id === it.topic);
      if (!t) bad.push('موضوع غير موجود: ' + it.topic);

      if (!KINDS.includes(a.kind)) bad.push('نوع إجابة غير معروف: ' + a.kind);

          else if (Math.abs(got - a.value) > (a.tol || 0.02) * Math.max(Math.abs(a.value), 1e-12))

  async function publish() { Perm.assert('questions:approve'); bank.version = (bank.version || 1) + 1; bank.status = 'published'; await save(); return bank.version; }

/* exam engine: build → answer (checked at once) → survive closing the app → result → topic */
const Exam = (() => {
  let current = null;
  const uid = () => 'at' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const CHEER = ['قريب جدًا، راجع هذه النقطة وحاول مرة أخرى.', 'لا بأس، هذه النقطة تستحق مراجعة سريعة.',
    'راجع طريقة الحل أعلاه، ستتضح في المرة القادمة.', 'خطأ مفيد: الآن تعرف أين تركّز.'];
  const persist = () => KV.set('exam:current', current);

  function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  async function build(opts) {
    opts = opts || {};
    let pool;
    if (opts.set) {
      const s = Bank.sets({ published: !opts.preview }).find(x => x.id === opts.set);
      if (!s) throw new Error('الاختبار غير منشور');
      pool = s.items.map(i => Bank.item(i)).filter(Bank.visible);
      opts.title = opts.title || s.title;
    } else if (opts.ids && opts.ids.length) {
      pool = opts.ids.map(id => Bank.item(id)).filter(Bank.visible);
      if (pool.length !== opts.ids.length) throw new Error('بعض الأسئلة المطلوبة غير متاحة');
    } else {
      pool = Bank.list({ visible: true });
      const chapters = opts.chapters || (opts.chapter ? [opts.chapter] : null);
      if (chapters) pool = pool.filter(i => chapters.includes(i.chapter));
      if (opts.topics && opts.topics.length) pool = pool.filter(i => opts.topics.includes(i.topic));
      if (opts.exam) pool = pool.filter(i => i.exam === opts.exam);
      if (opts.kinds) pool = pool.filter(i => opts.kinds.includes((i.answer || {}).kind));
      const src = opts.sources && opts.sources.length && !opts.sources.includes('mixed') ? opts.sources : null;
      if (src) pool = pool.filter(i => src.includes(i.src_kind || 'ministry'));
      if (opts.exclude) pool = pool.filter(i => !opts.exclude.includes(i.id));
    }
    const available = pool.length;
    if (!available) throw new Error('لا توجد أسئلة معتمدة بهذه المواصفات بعد');
    let picked;
    if (opts.ids || opts.set) picked = pool;
    else {
      // least-seen first, random among equals, spread over topics — a fresh exam each time
      const seen = (await KV.get('exam:seen')) || {};
      const prefer = opts.prefer ? new Set(opts.prefer) : null;
      const ranked = shuffle(pool.slice()).sort((a, b) =>
        ((prefer ? prefer.has(b.id) : 0) - (prefer ? prefer.has(a.id) : 0)) || ((seen[a.id] || 0) - (seen[b.id] || 0)));
      const byTopic = new Set(), first = [], rest = [];
      for (const it of ranked) (byTopic.has(it.topic) ? rest : (byTopic.add(it.topic), first)).push(it);
      picked = first.concat(rest).slice(0, opts.count || 10);
    }
    current = { id: uid(), created: Date.now(), title: opts.title || 'اختبار', scope: opts.scope || null,
      chapter: opts.chapter || null, chapters: opts.chapters || null, sources: opts.sources || ['mixed'],
      requested: opts.count || picked.length, available, items: picked.map(i => i.id), pos: 0,
      answers: {}, graded: {}, selfMarks: {}, submitted: false };
    await persist();
    return current;
  }
  function get(id) { return current && (!id || current.id === id) ? current : null; }
  async function resume() {
    const c = await KV.get('exam:current');
    current = c && !c.submitted && c.items && c.items.every(id => Bank.item(id)) ? c : null;
    return current;
  }
  function guard(itemId) {
    if (!current) throw new Error('لا يوجد اختبار مفتوح');
    if (current.submitted) throw new Error('الاختبار سُلّم');
    if (!current.items.includes(itemId)) throw new Error('هذا السؤال ليس ضمن الاختبار');
  }
  function answer(itemId, response) { guard(itemId); current.answers[itemId] = response; persist(); return true; }
  // answer and see the verdict right away — what the student sees after each question
  async function check(itemId, response) {
    guard(itemId);
    current.answers[itemId] = response;
    const r = Bank.grade(itemId, response), it = Bank.item(itemId);
    const wrongSoFar = Object.values(current.graded).filter(g => g.correct === false).length;
    const fb = { id: itemId, kind: r.kind, correct: r.correct, wantText: r.wantText, solution: r.solution || null,
      topic: it.topic, keysHit: r.keysHit, keysMissing: r.keysMissing,
      cheer: r.correct === false ? CHEER[wrongSoFar % CHEER.length] : null };
    current.graded[itemId] = fb;
    await persist();
    return fb;
  }
  async function selfMark(itemId, ok) { guard(itemId); current.selfMarks[itemId] = !!ok; if (current.graded[itemId]) current.graded[itemId].correct = !!ok; await persist(); }
  async function move(pos) { if (!current) return; current.pos = Math.max(0, Math.min(current.items.length - 1, pos)); await persist(); }
  async function submit(selfMarks) {
    if (!current) throw new Error('لا يوجد اختبار مفتوح');
    selfMarks = Object.assign({}, current.selfMarks, selfMarks || {});
    const perItem = [], perTopic = {};
    let score = 0, total = 0, pending = 0;
    for (const id of current.items) {
      const it = Bank.item(id), r = Bank.grade(id, current.answers[id]);
      const marks = it.marks || 1;
      let correct = r.correct;
      if (r.kind === 'essay') correct = (id in selfMarks) ? !!selfMarks[id] : null;
      if (!(id in current.answers) && r.kind !== 'essay') correct = false;
      total += marks;
      if (correct === true) score += marks; else if (correct === null) pending++;
      const t = it.topic;
      perTopic[t] = perTopic[t] || { topic: t, chapter: it.chapter, asked: 0, right: 0, wrong: 0, pending: 0, items: [] };
      perTopic[t].asked++; perTopic[t].items.push(id);
      if (correct === true) perTopic[t].right++; else if (correct === false) perTopic[t].wrong++; else perTopic[t].pending++;
      perItem.push({ id, topic: t, chapter: it.chapter, marks, correct, given: current.answers[id] === undefined ? null : current.answers[id],
        want: r.wantText, source: it.src_kind || 'ministry', result: r });
    }
    current.submitted = true;
    const attempt = { id: current.id, kind: 'attempt', created: current.created, finished: Date.now(),
      title: current.title, scope: current.scope, chapter: current.chapter, chapters: current.chapters, sources: current.sources,
      score, total, pending, percent: total ? Math.round(score / total * 100) : 0, items: perItem, topics: perTopic };
    await KV.set('attempt:' + attempt.id, attempt);
    const idx = (await KV.get('attempts:index')) || [];
    idx.unshift(attempt.id); await KV.set('attempts:index', idx.slice(0, 500));
    const seen = (await KV.get('exam:seen')) || {};
    for (const id of current.items) seen[id] = (seen[id] || 0) + 1;
    await KV.set('exam:seen', seen);
    await recordTopics(attempt);
    await KV.set('exam:current', null);
    current = null;
    return attempt;
  }
  async function abandon() { current = null; await KV.set('exam:current', null); }
  async function recordTopics(attempt) {
    const stats = (await KV.get('stats:topics')) || {};
    for (const t of Object.values(attempt.topics)) {
      const s = stats[t.topic] || { topic: t.topic, chapter: t.chapter, asked: 0, right: 0, wrong: 0, last: 0, wrongItems: [] };
      s.asked += t.asked; s.right += t.right; s.wrong += t.wrong; s.last = attempt.finished; s.chapter = t.chapter;
      for (const it of attempt.items) if (it.topic === t.topic && it.correct === false && !s.wrongItems.includes(it.id)) s.wrongItems.push(it.id);
      stats[t.topic] = s;
    }
    await KV.set('stats:topics', stats);
    return stats;
  }
  async function topicStats() { return (await KV.get('stats:topics')) || {}; }
  async function weakness(limit) {
    const stats = await topicStats();
    return Object.values(stats).filter(s => s.asked && s.wrong)
      .map(s => Object.assign({}, s, { rate: s.wrong / s.asked }))
      .sort((a, b) => b.rate - a.rate || b.wrong - a.wrong).slice(0, limit || 10);
  }
  // no AI: the weakest topics, questions missed before first, then fresh ones from the same topics
  async function buildWeakness(opts) {
    opts = opts || {};
    const weak = await weakness(opts.topics || 3);
    if (!weak.length) throw new Error('لا توجد أخطاء مسجلة بعد لبناء اختبار نقاط الضعف');
    return build({ topics: weak.map(w => w.topic), prefer: weak.flatMap(w => w.wrongItems), count: opts.count || 10,
      title: 'اختبار نقاط ضعفك', scope: 'weakness' });
  }
  async function attempts(limit) {
    const idx = (await KV.get('attempts:index')) || [];
    const out = [];
    for (const id of idx.slice(0, limit || 20)) { const a = await KV.get('attempt:' + id); if (a) out.push(a); }
    return out;
  }
  async function reset() {
    await KV.set('stats:topics', {}); await KV.set('attempts:index', []); await KV.set('exam:seen', {}); await KV.set('exam:current', null);
    current = null;
  }
  return { build, get, resume, answer, check, selfMark, move, submit, abandon, topicStats, weakness, buildWeakness, attempts, reset, recordTopics, CHEER };
})();
